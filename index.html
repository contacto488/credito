<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Clientes y crédito</title>
<link rel="icon" href="data:,">
<style>
/* Para ajustar los colores corporativos, cambie las variables de :root. */
:root {
  --pine-950: #0a211b; --pine-900: #0f2e26; --pine-700: #205244; --green-700: #096646; --green-600: #0b7d55; --green-100: #d6ebe1; --green-50: #edf6f1;
  --bg: #f2f4f2; --surface: #fff; --surface-2: #f7f9f7; --line: #dce2de; --line-strong: #bfc9c3; --ink: #16201c; --ink-2: #4b5953; --ink-3: #707d77;
  --ok-bg: #e2f2e7; --ok-ink: #14603a; --warn-bg: #fbeed0; --warn-ink: #7a4f00; --bad-bg: #fae6e5; --bad-ink: #9f2521; --info-bg: #e3ecf9; --info-ink: #1c4d93; --neutral-bg: #eaeeeb; --neutral-ink: #4b5953;
  --r: 10px; --r-sm: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg); }
h1, h2, h3, p, dl, dd, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--green-700); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #5aa7ff; outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------------- estructura */
.barra { background: var(--pine-900); color: #fff; }
.barra-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.marca { font-weight: 650; font-size: 16px; letter-spacing: .1px; margin-right: auto; display: flex; flex-direction: column; line-height: 1.25; }
.marca small { font-weight: 400; font-size: 12.5px; color: #b9cdc5; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { background: none; border: 0; color: #d7e4de; padding: 7px 12px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; }
.nav button:hover { background: rgba(255,255,255,.09); color: #fff; }
.nav button[aria-current="page"] { background: rgba(255,255,255,.16); color: #fff; }
.quien { font-size: 13px; color: #b9cdc5; text-align: right; line-height: 1.3; }
.quien b { color: #fff; font-weight: 600; display: block; }
.demo { background: #7a4f00; color: #fff; text-align: center; padding: 7px 16px; font-size: 13.5px; font-weight: 500; }
.pagina { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
.pie { text-align: center; color: var(--ink-3); font-size: 12px; padding: 0 0 26px; }
.encabezado { display: flex; align-items: flex-start; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 18px; }
.encabezado h1 { font-size: 23px; font-weight: 650; line-height: 1.25; }
.encabezado .sub { color: var(--ink-2); margin-top: 2px; }
.encabezado .acciones { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.fila { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.empuja { margin-left: auto; }

/* ---------------------------------------------------------------- piezas */
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
.tarjeta > .cab { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.tarjeta > .cab h2 { font-size: 16px; font-weight: 650; }
.tarjeta > .cab p { color: var(--ink-2); font-size: 13.5px; flex-basis: 100%; }
.tarjeta > .cuerpo { padding: 16px 18px; }
.tarjeta.destacada { border-color: var(--green-600); box-shadow: 0 0 0 3px var(--green-50); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid transparent; background: var(--green-700); color: #fff; font-weight: 550; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { background: var(--pine-700); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.sec:hover { background: var(--surface-2); }
.btn.mal { background: var(--bad-ink); }
.btn.mal:hover { background: #7f1c19; }
.btn.chico { padding: 5px 10px; font-size: 13.5px; }
.btn.liso { background: none; color: var(--green-700); border: 0; padding: 4px 6px; font-weight: 550; }
.btn.liso:hover { background: var(--green-50); }
.icono { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.etiqueta { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.etiqueta .icono { width: 13px; height: 13px; stroke-width: 2.4; }
.tono-bien { background: var(--ok-bg); color: var(--ok-ink); } .tono-aviso { background: var(--warn-bg); color: var(--warn-ink); }
.tono-mal { background: var(--bad-bg); color: var(--bad-ink); } .tono-info { background: var(--info-bg); color: var(--info-ink); }
.tono-neutro { background: var(--neutral-bg); color: var(--neutral-ink); }
.alerta { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--r-sm); margin-bottom: 14px; align-items: flex-start; }
.alerta .icono { margin-top: 2px; }
.alerta b { font-weight: 650; }
.tenue { color: var(--ink-2); } .chica { font-size: 13px; } .mono { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- formularios */
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px 16px; }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo.ancho { grid-column: 1 / -1; }
.campo label, .campo .rotulo { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.campo .ayuda { font-size: 12.5px; color: var(--ink-3); }
.campo .error { font-size: 12.5px; color: var(--bad-ink); font-weight: 550; }
.entrada { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: #fff; min-height: 38px; }
textarea.entrada { min-height: 84px; resize: vertical; }
.entrada:disabled { background: var(--surface-2); color: var(--ink-2); }
.opciones { display: flex; gap: 6px 16px; flex-wrap: wrap; }
.opciones label { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; color: var(--ink); font-size: 14.5px; cursor: pointer; }
.pie-form { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
h3.grupo { font-size: 14px; font-weight: 650; color: var(--ink-2); text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 10px; }
h3.grupo:first-child { margin-top: 0; }

/* ---------------------------------------------------------------- tablas y listas */
.tabla-caja { overflow-x: auto; }
table.tabla { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tabla th { text-align: left; font-size: 12.5px; font-weight: 650; color: var(--ink-2); text-transform: uppercase; letter-spacing: .4px; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.tabla td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla tr.clic { cursor: pointer; }
.tabla tr.clic:hover td { background: var(--green-50); }
.tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vacio { padding: 34px 18px; text-align: center; color: var(--ink-2); }
.datos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 20px; }
.datos dt { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.datos dd { overflow-wrap: anywhere; }
.pestanas { display: flex; gap: 6px; flex-wrap: wrap; }
.pestanas button { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 13px; border-radius: 99px; cursor: pointer; font-weight: 550; font-size: 14px; }
.pestanas button[aria-pressed="true"] { background: var(--pine-900); color: #fff; border-color: var(--pine-900); }
.pestanas .cuenta { opacity: .75; margin-left: 5px; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- ruta de la solicitud */
.ruta { display: flex; gap: 0; margin: 0 0 18px; counter-reset: paso; overflow-x: auto; }
.ruta li { flex: 1 1 0; min-width: 118px; position: relative; padding: 30px 6px 0; text-align: center; font-size: 12.5px; color: var(--ink-3); font-weight: 550; }
.ruta li::before { counter-increment: paso; content: counter(paso); position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); font-size: 12px; line-height: 20px; font-weight: 700; z-index: 1; }
.ruta li::after { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line-strong); }
.ruta li:first-child::after { display: none; }
.ruta li.hecho { color: var(--ok-ink); } .ruta li.hecho::before { background: var(--green-600); border-color: var(--green-600); color: #fff; content: "✓"; }
.ruta li.hecho::after, .ruta li.actual::after { background: var(--green-600); }
.ruta li.actual { color: var(--ink); font-weight: 700; } .ruta li.actual::before { border-color: var(--green-600); color: var(--green-700); box-shadow: 0 0 0 4px var(--green-100); }
.ruta li.mal::before { background: var(--bad-ink); border-color: var(--bad-ink); color: #fff; content: "✕"; }

/* ---------------------------------------------------------------- varios */
.historial li { padding: 9px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 215px 1fr; gap: 4px 14px; font-size: 14px; }
.historial li:last-child { border-bottom: 0; }
@media (max-width: 640px) { .historial li { grid-template-columns: 1fr; } .ruta li { min-width: 62px; font-size: 11px; padding-left: 2px; padding-right: 2px; } }
.barra-uso { height: 12px; border-radius: 99px; background: var(--neutral-bg); overflow: hidden; }
.barra-uso i { display: block; height: 100%; background: var(--green-600); }
.barra-uso.alto i { background: #c77700; } .barra-uso.lleno i { background: var(--bad-ink); }
.avisos { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(430px, calc(100vw - 32px)); }
.avisos > div { padding: 11px 14px; border-radius: var(--r-sm); box-shadow: 0 6px 22px rgba(0,0,0,.18); font-weight: 550; background: var(--pine-900); color: #fff; }
.avisos > div.mal { background: var(--bad-ink); }
.velo { position: fixed; inset: 0; background: rgba(10,33,27,.5); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: var(--r); width: min(560px, 100%); box-shadow: 0 18px 60px rgba(0,0,0,.3); }
.modal > h2 { font-size: 17px; font-weight: 650; padding: 16px 18px 0; }
.modal > .cuerpo { padding: 12px 18px 4px; }
.modal > .pie-form { padding: 6px 18px 18px; margin: 8px 0 0; }
.modal.ancho { width: min(980px, 100%); }
.caja-corr { margin-top: 8px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); }
iframe.visor { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: var(--r-sm); display: block; }
img.visor { max-width: 100%; height: auto; display: block; margin: 0 auto; border: 1px solid var(--line); }
.acceso { max-width: 440px; margin: 7vh auto 0; padding: 0 16px; }
.acceso h1 { font-size: 22px; font-weight: 650; margin-bottom: 4px; }
.acceso .tarjeta > .cuerpo { padding: 22px; }
.acceso .campo { margin-bottom: 13px; }
.progreso { height: 8px; background: var(--neutral-bg); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progreso i { display: block; height: 100%; background: var(--green-600); transition: width .15s; }
.doc-nombre { font-weight: 600; }
.doc-archivo { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: 13.5px; }
@media print { .barra, .demo, .avisos, .btn, .pestanas, .pie { display: none !important; } body { background: #fff; } .tarjeta { break-inside: avoid; } }

</style>
</head>

// Dígito de verificación del NIT (algoritmo de la DIAN).
function calcularDv(nit) {
  const d = soloDigitos(nit);
  if (!d || d.length > 15) return null;
  const pesos = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 67, 71];
  let suma = 0;
  for (let i = 0; i < d.length; i++) suma += Number(d[d.length - 1 - i]) * pesos[i];
  const r = suma % 11;
  return r > 1 ? 11 - r : r;
}
const fmtNit = (nit, dv) => { const d = soloDigitos(nit); return d ? Number(d).toLocaleString('es-CO') + (dv === 0 || dv ? '-' + dv : '') : '—'; };

// Vigencia de un documento: 'vigente', 'vencido', 'por_vencer' (faltan 7 días o menos), 'sin_fecha' o 'no_vence'.
function vigenciaDe(doc, tipo) {
  if (!tipo || !tipo.vigencia) return { estado: 'no_vence' };
  if (!doc || !doc.fechaExpedicion) return { estado: 'sin_fecha' };
  const vence = aFecha(doc.fechaExpedicion); vence.setDate(vence.getDate() + Number(tipo.vigencia));
  const dias = Math.floor((vence - aFecha(hoyISO())) / 86400000);
  return { estado: dias < 0 ? 'vencido' : dias <= 7 ? 'por_vencer' : 'vigente', vence, dias };
}

// Lista de documentos de una solicitud: los tipos configurados más los anexos que se hayan agregado.
function filasDocumentos(sol, config) {
  const tipos = (config.tiposDocumento || []).filter((t) => t.activo !== false);
  const docs = (sol && sol.docs) || {};
  const filas = tipos.map((t) => ({ tipo: t, doc: docs[t.codigo] || null }));
  // Documentos ya cargados cuyo tipo se desactivó después, y anexos libres.
  Object.keys(docs).forEach((c) => {
    if (tipos.some((t) => t.codigo === c)) return;
    filas.push({ tipo: { codigo: c, nombre: docs[c].nombreTipo || 'Anexo', obligatorio: false, vigencia: null, anexo: true }, doc: docs[c] });
  });
  return filas;
}

// Qué le falta a una solicitud para poder enviarse a revisión. Devuelve una lista de textos (vacía = lista).
function faltantes(sol, config) {
  const f = [];
  const c = sol.cliente || {}, cr = sol.credito || {};
  Object.values(CAMPOS_CLIENTE).forEach((campos) => campos.forEach(([k, etiqueta, req]) => { if (req && !limpio(c[k])) f.push('Dato del cliente: ' + etiqueta); }));
  if (!(cr.cupoSolicitado > 0)) f.push('Cupo solicitado');
  if (!cr.plazoSolicitado) f.push('Plazo solicitado');
  filasDocumentos(sol, config).forEach(({ tipo, doc }) => {
    const cargado = doc && doc.archivoId;
    if (tipo.obligatorio && !cargado) { f.push('Documento: ' + tipo.nombre); return; }
    if (!cargado) return;
    const v = vigenciaDe(doc, tipo);
    if (v.estado === 'sin_fecha') f.push('Fecha de expedición de: ' + tipo.nombre);
    if (v.estado === 'vencido') f.push('Documento vencido: ' + tipo.nombre);
    if (doc.revision && doc.revision.estado === 'no_conforme') f.push('Documento por corregir: ' + tipo.nombre);
  });
  return f;
}

// La decisión que rige hoy: la del estudio actual si ya se decidió; si no, la del último estudio anterior.
function ultimaDecision(f) {
  if (f.decision) return Object.assign({ numero: f.numeroEstudio || 1 }, f.decision);
  const e = f.estudios || [];
  for (let i = e.length - 1; i >= 0; i--) if (e[i].decision) return Object.assign({ numero: e[i].numero }, e[i].decision);
  return null;
}
// Cuántos documentos cargados están vencidos o por vencer.
function alertasDocs(f, config) {
  const r = { cargados: 0, vencidos: 0, porVencer: 0 };
  filasDocumentos(f, config).forEach(({ tipo, doc }) => {
    if (!(doc && doc.archivoId)) return;
    r.cargados++; const v = vigenciaDe(doc, tipo).estado;
    if (v === 'vencido') r.vencidos++; else if (v === 'por_vencer') r.porVencer++;
  });
  return r;
}

// Mensajes de error entendibles.
function textoError(e) {

  if (/weak-password/i.test(c)) return 'La contraseña es muy corta: use al menos 8 caracteres.';

  if (/requires-recent-login/i.test(c)) return 'Por seguridad, cierre la sesión, vuelva a entrar y repita el cambio.';

  if (/operation-not-allowed/i.test(c)) return 'El inicio de sesión con correo y contraseña no está activado en Firebase (Paso 2 de la guía).';

  if (c === 'not-found' && /database/i.test((e && e.message) || '')) return 'No se encontró la base de datos Firestore del proyecto. Debe existir y llamarse (default) (Paso 3 de la guía).';
  if (c === 'not-found') return 'Ese registro ya no existe.';
  return (e && e.mensaje) || 'No se pudo completar la acción. ' + (c ? '(Código: ' + String(c).slice(0, 120) + ')' : '');
}

// 2. SIMULADOR — modo demostración y pruebas.

function reglasSimuladas(op, ruta, uid, antesDe, despuesDe) {
  const seg = ruta.split('/');
  const perfil = uid ? antesDe('usuarios/' + uid) : null;
  const activo = Boolean(perfil && perfil.activo === true);
  const rol = (r) => activo && (perfil.roles || []).includes(r);
  const viejo = antesDe(ruta) || {}, nuevo = despuesDe(ruta) || {};
  const igual = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const cambia = (campos) => [...new Set([...Object.keys(viejo), ...Object.keys(nuevo)])].every((k) => igual(viejo[k], nuevo[k]) || campos.includes(k));
  const pasa = (de, a) => viejo.estado === de && nuevo.estado === a;
  const leer = op === 'get' || op === 'list';
  const por = (o) => (o && o.por) || null;
  // La ficha admite cambios de documentos salvo mientras está en estudio (revisión, evaluación o aprobación).
  const editable = (id) => { const f = antesDe('clientes/' + id); return Boolean(f) && ['borrador', 'devuelta', 'aprobada', 'rechazada'].includes(f.estado); };

  if (seg[0] === 'config' && seg[1] === 'instalacion' && seg.length === 2) {
    if (op === 'get') return true;
    if (op === 'create') return Boolean(uid) && nuevo.por === uid && Boolean(despuesDe('usuarios/' + uid));
    return false;
  }
  if (seg[0] === 'config' && seg.length === 2) return leer ? activo : op !== 'delete' && rol('administrador');
  if (seg[0] === 'usuarios' && seg.length === 2) {
    if (op === 'get') return Boolean(uid) && (uid === seg[1] || rol('administrador'));
    if (op === 'list') return rol('administrador');
    if (op === 'create') {
      return rol('administrador') || (uid === seg[1] && !antesDe('config/instalacion') && Boolean(despuesDe('config/instalacion')) &&
        igual(nuevo.roles, ['administrador']) && nuevo.activo === true);
    }
    if (op === 'update') return rol('administrador');
    return false;
  }
  if (seg[0] === 'clientes' && seg.length === 2) {
    const nit = seg[1], final = ['aprobada', 'rechazada'].includes(viejo.estado);
    const lista = (x) => (Array.isArray(x) ? x : []);
    if (leer) return activo;
    if (op === 'create') return rol('asesor') && nuevo.estado === 'borrador' && nuevo.creadoPor === uid && nuevo.nit === nit && (nuevo.cliente || {}).nit === nit && lista(nuevo.estudios).length === 0 && Array.isArray(nuevo.estudios);
    if (op === 'delete') return (rol('asesor') || rol('administrador')) && viejo.estado === 'borrador' && lista(viejo.estudios).length === 0;
    const mismoNit = (nuevo.cliente || {}).nit === nit;
    const n = lista(viejo.estudios).length;
    return (
      // Asesor: completa la ficha y la envía a estudio.
      (rol('asesor') && ['borrador', 'devuelta'].includes(viejo.estado) && (nuevo.estado === viejo.estado || nuevo.estado === 'en_revision') && mismoNit &&
        cambia(['cliente', 'credito', 'docs', 'estado', 'enviado', 'actualizado'])) ||
      (rol('revisor') && pasa('en_revision', 'en_evaluacion') && por(nuevo.revision) === uid && cambia(['estado', 'revision', 'docs', 'actualizado'])) ||
      (rol('revisor') && pasa('en_revision', 'devuelta') && por(nuevo.devolucion) === uid && cambia(['estado', 'devolucion', 'docs', 'actualizado'])) ||
      (rol('financiero') && pasa('en_evaluacion', 'pendiente_aprobacion') && por(nuevo.evaluacion) === uid && por(viejo.revision) !== uid &&
        cambia(['estado', 'evaluacion', 'actualizado'])) ||
      (rol('financiero') && pasa('en_evaluacion', 'devuelta') && por(nuevo.devolucion) === uid && cambia(['estado', 'devolucion', 'actualizado'])) ||
      (rol('gerencia') && viejo.estado === 'pendiente_aprobacion' && ['aprobada', 'rechazada'].includes(nuevo.estado) && por(nuevo.decision) === uid &&
        por(viejo.revision) !== uid && por(viejo.evaluacion) !== uid && cambia(['estado', 'decision', 'actualizado'])) ||
      (rol('gerencia') && pasa('pendiente_aprobacion', 'devuelta') && por(nuevo.devolucion) === uid && cambia(['estado', 'devolucion', 'actualizado'])) ||
      // Decidida: el asesor registra el aviso (una vez), mantiene al día datos y documentos, o inicia un nuevo estudio.
      (rol('asesor') && final && nuevo.estado === viejo.estado && viejo.informado == null && por(nuevo.informado) === uid && cambia(['informado', 'abierta', 'actualizado'])) ||
      (rol('asesor') && final && nuevo.estado === viejo.estado && mismoNit && cambia(['cliente', 'docs', 'actualizado'])) ||
      (rol('asesor') && final && viejo.informado != null && nuevo.estado === 'borrador' &&
        nuevo.decision == null && nuevo.evaluacion == null && nuevo.revision == null && nuevo.informado == null &&
        lista(nuevo.estudios).length === n + 1 && igual(lista(nuevo.estudios).slice(0, n), lista(viejo.estudios)) && igual((lista(nuevo.estudios)[n] || {}).decision, viejo.decision) &&
        cambia(['estado', 'abierta', 'estudios', 'numeroEstudio', 'enviado', 'revision', 'evaluacion', 'decision', 'devolucion', 'informado', 'docs', 'credito', 'actualizado'])) ||
      (rol('administrador') && final && nuevo.estado === viejo.estado && cambia(['docs', 'actualizado']))
    );
  }
  if (seg[0] === 'clientes' && seg[2] === 'historial' && seg.length === 4) {
    if (leer) return activo;
    if (op === 'create') return activo && nuevo.uid === uid && Boolean(nuevo.fechaServidor && nuevo.fechaServidor.__ts);

  }
  if (seg[0] === 'archivos' && seg.length === 2) {

    if (op === 'create') return rol('asesor') && Boolean(archivo) && archivo.subidoPor === uid;
    if (op === 'delete') return rol('administrador') || (rol('asesor') && Boolean(archivo) && editable(archivo.clienteId));
    return false;
  }
  return false;
}

function crearSimulador() {
  const CLAVE = 'credito-demo-v2';
  let almacen = null;
  try { almacen = window.localStorage; almacen.getItem(CLAVE); } catch (e) { almacen = null; }
  let estado = { docs: {}, cuentas: {}, sesion: null };
  try { const g = almacen && almacen.getItem(CLAVE); if (g) estado = Object.assign(estado, JSON.parse(g)); } catch (e) { /* datos dañados: se empieza de cero */ }
  const binarios = new Map(); // el contenido de los archivos vive solo en memoria: se pierde al recargar la página
  const guardar = () => { try { almacen && almacen.setItem(CLAVE, JSON.stringify(estado)); } catch (e) { /* sin espacio: sigue en memoria */ } };
  const copia = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const error = (code, msg) => Object.assign(new Error(msg || code), { code });
  const TS = { __centinela: 'ts' }, BORRAR = { __centinela: 'borrar' };
  const autoId = () => Array.from({ length: 20 }, () => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 62)]).join('');
  const pausa = () => new Promise((r) => setTimeout(r, 15));

  // --- conversión de valores al guardar y al leer
  function congelar(v, clave, pendientes) {
    if (v === undefined) throw error('invalid-argument', 'Unsupported field value: undefined (' + clave + ')');
    if (v === TS) return { __ts: Date.now() };
    if (v === BORRAR) return BORRAR;
    if (v && v.__u8) { pendientes.push([clave, v.__u8]); return { __bytes: clave, n: v.__u8.length }; }
    if (Array.isArray(v)) return v.map((x, i) => congelar(x, clave + '.' + i, pendientes));
    if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach((k) => { o[k] = congelar(v[k], clave + '.' + k, pendientes); }); return o; }
    return v;
  }
  function revivir(v) {
    if (Array.isArray(v)) return v.map(revivir);
    if (v && typeof v === 'object') {

      if (v.__bytes) return { toUint8Array: () => binarios.get(v.__bytes) || null };
      const o = {}; Object.keys(v).forEach((k) => { o[k] = revivir(v[k]); }); return o;
    }
    return v;
  }
  const foto = (ruta, db) => { const d = estado.docs[ruta]; return { id: ruta.split('/').pop(), ref: { tipo: 'doc', db, ruta, id: ruta.split('/').pop() }, exists: () => d !== undefined, data: () => (d === undefined ? undefined : revivir(copia(d))) }; };

  // --- escritura atómica con verificación de reglas
  function aplicar(ops, uid) {
    const despues = Object.assign({}, estado.docs), pendientes = [];
    ops.forEach((o) => {
      if (o.tipo === 'delete') { delete despues[o.ruta]; return; }
      if (o.tipo === 'update' && despues[o.ruta] === undefined) throw error('not-found', 'No document to update: ' + o.ruta);
      const base = o.tipo === 'set' && !o.merge ? {} : copia(despues[o.ruta] || {});
      Object.keys(o.datos).forEach((k) => {
        const val = congelar(o.datos[k], o.ruta + '#' + k, pendientes);
        // En una actualización, "docs.rut" cambia solo ese dato dentro de "docs" (igual que en Firebase).
        const camino = o.tipo === 'update' ? k.split('.') : [k];
        let nodo = base;
        camino.slice(0, -1).forEach((c) => { if (!nodo[c] || typeof nodo[c] !== 'object') nodo[c] = {}; nodo = nodo[c]; });
        const hoja = camino[camino.length - 1];
        if (val === BORRAR) delete nodo[hoja]; else nodo[hoja] = val;
      });
      despues[o.ruta] = base;
    });
    ops.forEach((o) => {
      const existia = estado.docs[o.ruta] !== undefined;
      if (o.tipo === 'delete' && !existia) return;
      const op = o.tipo === 'delete' ? 'delete' : existia ? 'update' : 'create';
      if (!reglasSimuladas(op, o.ruta, uid, (r) => estado.docs[r], (r) => despues[r])) throw error('permission-denied', 'Missing or insufficient permissions. [' + op + ' ' + o.ruta + ']');
    });

    if (!auths.has(nombre)) {
      const a = { nombre, currentUser: null, oyentes: new Set() };
      if (nombre === '[DEFAULT]' && estado.sesion && estado.cuentas[estado.sesion]) a.currentUser = { uid: estado.sesion, email: estado.cuentas[estado.sesion].email };

  const rutaDe = (base, seg) => (base && base.tipo ? [base.ruta].concat(seg) : seg).join('/');

  return {
    esSimulador: true,
    borrarTodo() { estado = { docs: {}, cuentas: {}, sesion: null }; binarios.clear(); guardar(); },
    initializeApp: (config, nombre) => ({ nombre: nombre || '[DEFAULT]' }),

    getAuth: authDe, initializeAuth: authDe, inMemoryPersistence: {}, browserLocalPersistence: {},

    async signInWithEmailAndPassword(auth, email, clave) {
      await pausa();

    async createUserWithEmailAndPassword(auth, email, clave) {
      await pausa();
      const correo = String(email).trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) throw error('auth/invalid-email');
      if (String(clave).length < 6) throw error('auth/weak-password');
      if (Object.values(estado.cuentas).some((x) => x.email === correo)) throw error('auth/email-already-in-use');
      const uid = autoId(); estado.cuentas[uid] = { uid, email: correo, clave }; guardar();
      const u = { uid, email: correo }; fijarUsuario(auth, u); return { user: u };
    },
    async signOut(auth) { await pausa(); fijarUsuario(auth, null); },
    async sendPasswordResetEmail() { await pausa(); },
    async updatePassword(user, nueva) { await pausa(); if (String(nueva).length < 6) throw error('auth/weak-password'); estado.cuentas[user.uid].clave = nueva; guardar(); },
    // En Firebase real el correo cambia cuando la persona abre el enlace que recibe; aquí se aplica de inmediato.
    async verifyBeforeUpdateEmail(user, nuevo) {
      await pausa();
      const correo = String(nuevo).trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) throw error('auth/invalid-email');
      if (Object.values(estado.cuentas).some((x) => x.email === correo)) throw error('auth/email-already-in-use');
      estado.cuentas[user.uid].email = correo; user.email = correo; guardar();
    },
    async reauthenticateWithCredential(user, cred) { await pausa(); if (estado.cuentas[user.uid].clave !== cred.clave) throw error('auth/invalid-credential'); },
    EmailAuthProvider: { credential: (email, clave) => ({ email, clave }) },

    // --- base de datos
    getFirestore: (app) => ({ app }),
    doc(base, ...seg) { const ruta = base && base.tipo === 'col' ? base.ruta + '/' + (seg[0] || autoId()) : rutaDe(base, seg); return { tipo: 'doc', db: dbDe(base), ruta, id: ruta.split('/').pop() }; },
    collection(base, ...seg) { return { tipo: 'col', db: dbDe(base), ruta: rutaDe(base, seg) }; },
    serverTimestamp: () => TS,
    deleteField: () => BORRAR,
    Bytes: { fromUint8Array: (u8) => ({ __u8: u8, toUint8Array: () => u8 }) },
    where: (campo, op, valor) => ({ clase: 'where', campo, op, valor }),
    orderBy: (campo, dir) => ({ clase: 'orderBy', campo, dir: dir || 'asc' }),
    limit: (n) => ({ clase: 'limit', n }),
    query: (col, ...r) => ({ tipo: 'col', ruta: col.ruta, db: col.db, restricciones: (col.restricciones || []).concat(r) }),
    async getDoc(ref) { await pausa(); leerCon('get', ref.ruta, uidDe(ref.db)); return foto(ref.ruta, ref.db); },
    async getDocs(q) {
      await pausa(); leerCon('list', q.ruta + '/_', uidDe(q.db));
      const nivel = q.ruta.split('/').length + 1;
      let rutas = Object.keys(estado.docs).filter((r) => r.startsWith(q.ruta + '/') && r.split('/').length === nivel);
      (q.restricciones || []).forEach((c) => {
        if (c.clase === 'where') {
          if (c.op !== '==') throw error('unimplemented', 'El simulador solo admite where con ==');
          rutas = rutas.filter((r) => estado.docs[r][c.campo] === c.valor);
        }
      });
      (q.restricciones || []).filter((c) => c.clase === 'orderBy').reverse().forEach((c) => {
        rutas.sort((a, b) => { const x = estado.docs[a][c.campo], y = estado.docs[b][c.campo]; return (x > y ? 1 : x < y ? -1 : 0) * (c.dir === 'desc' ? -1 : 1); });
      });
      const lim = (q.restricciones || []).find((c) => c.clase === 'limit'); if (lim) rutas = rutas.slice(0, lim.n);
      const docs = rutas.map((r) => foto(r, q.db));
      return { docs, size: docs.length, empty: !docs.length, forEach: (f) => docs.forEach(f) };
    },
    async setDoc(ref, datos, opc) { await pausa(); aplicar([{ tipo: 'set', ruta: ref.ruta, datos, merge: Boolean(opc && opc.merge) }], uidDe(ref.db)); },
    async updateDoc(ref, datos) { await pausa(); aplicar([{ tipo: 'update', ruta: ref.ruta, datos }], uidDe(ref.db)); },
    async deleteDoc(ref) { await pausa(); aplicar([{ tipo: 'delete', ruta: ref.ruta }], uidDe(ref.db)); },
    async addDoc(col, datos) { await pausa(); const ruta = col.ruta + '/' + autoId(); aplicar([{ tipo: 'set', ruta, datos }], uidDe(col.db)); return { tipo: 'doc', db: col.db, ruta, id: ruta.split('/').pop() }; },
    writeBatch(db) {
      const ops = [];
      const lote = {
        set(ref, datos, opc) { ops.push({ tipo: 'set', ruta: ref.ruta, datos, merge: Boolean(opc && opc.merge) }); return lote; },
        update(ref, datos) { ops.push({ tipo: 'update', ruta: ref.ruta, datos }); return lote; },
        delete(ref) { ops.push({ tipo: 'delete', ruta: ref.ruta }); return lote; },
        async commit() { await pausa(); aplicar(ops, uidDe(db)); },
      };
      return lote;
    },
    async runTransaction(db, fn) {
      const ops = [];
      const tx = {
        async get(ref) { leerCon('get', ref.ruta, uidDe(db)); return foto(ref.ruta, db); },
        set(ref, datos, opc) { ops.push({ tipo: 'set', ruta: ref.ruta, datos, merge: Boolean(opc && opc.merge) }); return tx; },
        update(ref, datos) { ops.push({ tipo: 'update', ruta: ref.ruta, datos }); return tx; },
        delete(ref) { ops.push({ tipo: 'delete', ruta: ref.ruta }); return tx; },
      };
      const r = await fn(tx); await pausa(); aplicar(ops, uidDe(db)); return r;
    },
  };
}

// ===================================================================================================
// 3. DATOS — todo lo que la página lee o escribe en Firebase pasa por aquí.
//    `F` es la librería de Firebase (o el simulador, en modo demostración).
// ===================================================================================================
function crearAlmacen(F, configFirebase) {
  const app = F.initializeApp(configFirebase);
  const auth = F.getAuth(app);
  const db = F.getFirestore(app);
  const D = (...seg) => F.doc(db, ...seg);
  const C = (...seg) => F.collection(db, ...seg);
  const datos = (snap) => (snap.exists() ? Object.assign({ id: snap.id }, snap.data()) : null);
  const parte = (i) => String(i).padStart(4, '0');
  let yo = null; // perfil de quien tiene la sesión abierta: { uid, nombre, correo, roles }

  // Cada cambio deja una línea en el historial de la ficha (no se puede editar ni borrar).
  const evento = (lote, nit, accion, detalle) => lote.set(F.doc(C('clientes', nit, 'historial')), {
    fechaServidor: F.serverTimestamp(), fecha: ahoraISO(), uid: yo.uid, nombre: yo.nombre, accion, detalle: detalle || '',
  });

  const A = {
    demo: Boolean(F.esSimulador),
    alCambiarSesion: (cb) => F.onAuthStateChanged(auth, cb),
    usuarioActual: () => auth.currentUser,
    fijarPerfil(p) { yo = p; },

    // ------------------------------------------------------------------ instalación y sesión
    async instalado() { return (await F.getDoc(D('config', 'instalacion'))).exists(); },
    async crearPrimerAdmin({ nombre, correo, clave, empresa }) {
      let cred;
      try { cred = await F.createUserWithEmailAndPassword(auth, limpio(correo), clave); } catch (e) {
        // Si un intento anterior dejó la cuenta creada pero sin terminar, se continúa con ella.
        if (/email-already-in-use/.test((e && e.code) || '')) cred = await F.signInWithEmailAndPassword(auth, limpio(correo), clave); else throw e;
      }
      const uid = cred.user.uid;
      const lote = F.writeBatch(db);
      lote.set(D('usuarios', uid), { nombre: limpio(nombre), correo: limpio(correo).toLowerCase(), roles: ['administrador'], activo: true, creado: ahoraISO() });
      lote.set(D('config', 'instalacion'), { hecha: true, por: uid, fecha: ahoraISO() });
      await lote.commit();
      await F.setDoc(D('config', 'general'), { empresa: limpio(empresa) || CONFIG_DEFECTO.empresa, tiposDocumento: TIPOS_DOC_DEFECTO });
      return uid;
    },
    ingresar: (correo, clave) => F.signInWithEmailAndPassword(auth, limpio(correo), clave),
    salir: () => F.signOut(auth),
    recuperarClave: (correo) => F.sendPasswordResetEmail(auth, limpio(correo)),
    async cambiarClave(actual, nueva) {
      const u = auth.currentUser;
      await F.reauthenticateWithCredential(u, F.EmailAuthProvider.credential(u.email, actual));
      await F.updatePassword(u, nueva);
    },

    // ------------------------------------------------------------------ usuarios y configuración
    async perfilDe(uid) { return datos(await F.getDoc(D('usuarios', uid))); },
    async usuarios() { return (await F.getDocs(C('usuarios'))).docs.map(datos).sort((a, b) => normalizar(a.nombre).localeCompare(normalizar(b.nombre))); },
    async crearUsuario({ nombre, correo, clave, roles }) {
      // Se usa una segunda conexión para que crear la cuenta no cierre la sesión del administrador.
      const app2 = F.initializeApp(configFirebase, 'alta-' + Date.now());
      try {
        const auth2 = F.initializeAuth(app2, { persistence: F.inMemoryPersistence });
        let cred;
        try { cred = await F.createUserWithEmailAndPassword(auth2, limpio(correo), clave); } catch (e) {
          if (!/email-already-in-use/.test((e && e.code) || '')) throw e;
          // La cuenta ya existe en Firebase: si quedó a medias (sin perfil) se termina de crear con la misma contraseña.
          try { cred = await F.signInWithEmailAndPassword(auth2, limpio(correo), clave); } catch (e2) { throw fallo('Ya existe una cuenta con ese correo.'); }
          if ((await F.getDoc(D('usuarios', cred.user.uid))).exists()) throw fallo('Ya existe un usuario con ese correo.');
        }
        await F.setDoc(D('usuarios', cred.user.uid), { nombre: limpio(nombre), correo: limpio(correo).toLowerCase(), roles, activo: true, creado: ahoraISO() });
        try { await F.signOut(auth2); } catch (e) { /* la conexión auxiliar se descarta de todos modos */ }
        return cred.user.uid;
      } finally { try { await F.deleteApp(app2); } catch (e) { /* nada que hacer */ } }
    },
    guardarUsuario: (uid, cambios) => F.updateDoc(D('usuarios', uid), cambios),
    // El correo es la identidad de la cuenta en Firebase y, sin servidor, solo su dueño puede cambiarlo:
    // Firebase envía un enlace al correo nuevo y el cambio queda hecho cuando la persona lo abre.
    async cambiarMiCorreo(clave, nuevo) {
      const u = auth.currentUser;
      await F.reauthenticateWithCredential(u, F.EmailAuthProvider.credential(u.email, clave));
      await F.verifyBeforeUpdateEmail(u, limpio(nuevo).toLowerCase());
    },
    // Corregir el correo de otra persona: se crea de nuevo su cuenta con el correo correcto (mismo nombre y roles)
    // y la cuenta con el correo equivocado queda desactivada y oculta.
    async corregirCorreo(usuario, nuevoCorreo, clave) {
      // Si ya firmó la revisión o la evaluación de un estudio que sigue en curso, la cuenta nueva contaría como otra persona.
      const enCurso = (await A.clientes()).filter((f) => ['en_evaluacion', 'pendiente_aprobacion'].includes(f.estado) && [f.revision, f.evaluacion].some((x) => x && x.por === usuario.id));
      if (enCurso.length) throw fallo('Esta persona ya firmó pasos de ' + enCurso.length + (enCurso.length === 1 ? ' estudio que sigue' : ' estudios que siguen') + ' en curso. Espere a que gerencia los decida y corrija el correo después.');
      const uid = await A.crearUsuario({ nombre: usuario.nombre, correo: nuevoCorreo, clave, roles: usuario.roles || [] });
      await F.updateDoc(D('usuarios', usuario.id), { activo: false, reemplazada: true, reemplazadaPor: uid, reemplazadaEn: ahoraISO() });
      return uid;
    },
    async config() { const c = datos(await F.getDoc(D('config', 'general'))); return Object.assign({}, CONFIG_DEFECTO, c || {}); },
    guardarConfig: (cfg) => F.setDoc(D('config', 'general'), { empresa: limpio(cfg.empresa), tiposDocumento: cfg.tiposDocumento }),

    // ------------------------------------------------------------------ fichas de clientes
    // Cada cliente tiene una sola ficha, identificada por su NIT o cédula.
    async clientes() { return (await F.getDocs(F.query(C('clientes'), F.limit(3000)))).docs.map(datos).sort((a, b) => (a.actualizado < b.actualizado ? 1 : -1)); },
    async ficha(nit) { return datos(await F.getDoc(D('clientes', nit))); },
    async historial(nit) { return (await F.getDocs(C('clientes', nit, 'historial'))).docs.map(datos).sort((a, b) => (a.fecha < b.fecha ? 1 : -1)); },
    async crearFicha({ cliente, credito }) {
      const ref = D('clientes', cliente.nit);
      await F.runTransaction(db, async (tx) => {
        if ((await tx.get(ref)).exists()) throw fallo('Ya existe una ficha para ese NIT o cédula. Búsquela en la lista de clientes.');
        tx.set(ref, {
          nit: cliente.nit, estado: 'borrador', abierta: true, numeroEstudio: 1, estudios: [],
          creado: ahoraISO(), creadoPor: yo.uid, creadoNombre: yo.nombre, actualizado: ahoraISO(),
          cliente, credito, docs: {}, enviado: null, revision: null, evaluacion: null, decision: null, devolucion: null, informado: null,
        });
        tx.set(F.doc(C('clientes', cliente.nit, 'historial')), { fechaServidor: F.serverTimestamp(), fecha: ahoraISO(), uid: yo.uid, nombre: yo.nombre, accion: 'Creó la ficha del cliente', detalle: '' });
      });
      return { id: cliente.nit };
    },
    // Guarda cambios en una ficha y, si se indica, deja la línea en el historial. Las reglas de la base de datos
    // deciden si quien tiene la sesión puede hacer ese cambio en el estado en que está la ficha.
    async guardar(nit, cambios, accion, detalle) {
      const lote = F.writeBatch(db);
      lote.update(D('clientes', nit), Object.assign({}, cambios, { actualizado: ahoraISO() }));
      if (accion) evento(lote, nit, accion, detalle);
      await lote.commit();
    },
    async eliminarFicha(f) {
      for (const d of Object.values(f.docs || {})) if (d && d.archivoId) { try { await A.borrarArchivo(d.archivoId, d.partes); } catch (e) { /* se intenta seguir */ } }
      await F.deleteDoc(D('clientes', f.id));
    },

    // ------------------------------------------------------------------ archivos (guardados en partes dentro de la base de datos)
    async subirArchivo(clienteId, codigo, archivo, alAvanzar) {
      const u8 = new Uint8Array(await archivo.arrayBuffer());
      const total = Math.max(1, Math.ceil(u8.length / TAM_PARTE));
      const ref = F.doc(C('archivos'));
      await F.setDoc(ref, { clienteId, codigo, nombre: archivo.name, tipo: archivo.type || '', tamano: u8.length, partes: total, subidoPor: yo.uid, fecha: ahoraISO() });
      try {
        for (let i = 0; i < total; i++) {
          await F.setDoc(D('archivos', ref.id, 'partes', parte(i)), { n: i, datos: F.Bytes.fromUint8Array(u8.slice(i * TAM_PARTE, (i + 1) * TAM_PARTE)) });
          if (alAvanzar) alAvanzar((i + 1) / total);
        }
      } catch (e) {
        try { await A.borrarArchivo(ref.id, total); } catch (e2) { /* quedará sin uso; no afecta a la ficha */ }
        throw e;
      }
      return { archivoId: ref.id, nombre: archivo.name, tipo: archivo.type || '', tamano: u8.length, partes: total };
    },
    async leerArchivo(meta) {
      const fotos = await Promise.all(Array.from({ length: meta.partes }, (_, i) => F.getDoc(D('archivos', meta.archivoId, 'partes', parte(i)))));
      const trozos = fotos.map((s) => (s.exists() && s.data().datos ? s.data().datos.toUint8Array() : null));
      if (trozos.some((t) => !t)) throw fallo('El archivo no está disponible' + (A.demo ? ': en la demostración los archivos se pierden al recargar la página.' : '.'));
      return new Blob(trozos, { type: meta.tipo || 'application/octet-stream' });
    },
    async borrarArchivo(archivoId, partes) {
      for (let i = 0; i < partes; i++) await F.deleteDoc(D('archivos', archivoId, 'partes', parte(i)));
      await F.deleteDoc(D('archivos', archivoId));
    },
    campoBorrado: () => F.deleteField(),
  };
  return A;
}

const TRAZOS = {
  check: 'M5 12.5l4.5 4.5L19 7.5', x: 'M6 6l12 12M18 6L6 18', mas: 'M12 5v14M5 12h14', atras: 'M19 12H5M11 18l-6-6 6-6',
  alerta: 'M12 3.5L22 20.5H2L12 3.5zM12 10v4.5M12 17.6v.1', info: 'M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v6M12 7.6v.1',
  archivo: 'M6 2.5h8l5 5v14H6v-19zM14 2.5v5h5', subir: 'M12 16V4M7 9l5-5 5 5M5 20h14', bajar: 'M12 4v12M7 11l5 5 5-5M5 20h14',
  ojo: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z', lupa: 'M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4',
  reloj: 'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2', basura: 'M4 7h16M9 7V4h6v3M6.5 7l1 13.5h9l1-13.5', girar: 'M20 11a8 8 0 10-2.3 5.7M20 5v6h-6',
  chat: 'M4 5h16v11H9l-5 4V5z', copiar: 'M9 9h11v11H9zM5 15H4V4h11v1', lapiz: 'M4 20l1-4L16.5 4.5l3 3L8 19l-4 1z', usuario: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4.5 20.5c.6-3.8 3.6-5.5 7.5-5.5s6.9 1.7 7.5 5.5',
};
const Icono = ({ n }) => html`<svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d=${TRAZOS[n] || ''} /></svg>`;
const ICONO_TONO = { bien: 'check', mal: 'x', aviso: 'alerta', info: 'reloj', neutro: 'lapiz' };
const Etiqueta = ({ tono, icono, children }) => html`<span class=${'etiqueta tono-' + (tono || 'neutro')}><${Icono} n=${icono || ICONO_TONO[tono] || 'info'} />${children}</span>`;
const EtiquetaEstado = ({ estado }) => { const e = ESTADOS[estado] || { label: estado, tono: 'neutro' }; return html`<${Etiqueta} tono=${e.tono}>${e.label}<//>`; };
const Alerta = ({ tono, children }) => html`<div class=${'alerta tono-' + (tono || 'info')} role=${tono === 'mal' ? 'alert' : 'status'}><${Icono} n=${tono === 'bien' ? 'check' : tono === 'info' ? 'info' : 'alerta'} /><div>${children}</div></div>`;

function Campo({ etiqueta, ayuda, error, ancho, children, para }) {
  return html`<div class=${'campo' + (ancho ? ' ancho' : '')}>
    <label for=${para}>${etiqueta}</label>${children}
    ${error ? html`<span class="error">${error}</span>` : ayuda ? html`<span class="ayuda">${ayuda}</span>` : null}
  </div>`;
}
// Campo de texto conectado a un objeto de valores: <Texto v=valores c="nombre" poner=setValores />
function Texto({ v, c, poner, etiqueta, ayuda, error, tipo, ancho, largo, opciones, requerido, lineas, deshabilitado }) {
  const id = 'f-' + c;
  const cambiar = (e) => poner(Object.assign({}, v, { [c]: tipo === 'dinero' ? fmtMiles(e.target.value) : e.target.value }));
  const comunes = { id, class: 'entrada', value: v[c] == null ? '' : v[c], onInput: cambiar, disabled: deshabilitado, 'aria-invalid': error ? 'true' : null };
  const rotulo = html`${etiqueta}${requerido ? html`<span class="tenue" title="Obligatorio"> *</span>` : null}`;
  let control;
  if (opciones) control = html`<select ...${comunes}><option value="">Seleccione…</option>${opciones.map((o) => (Array.isArray(o) ? html`<option value=${o[0]}>${o[1]}</option>` : html`<option value=${o}>${o}</option>`))}</select>`;
  else if (lineas) control = html`<textarea ...${comunes} rows=${lineas} maxlength=${largo || 2000}></textarea>`;
  else control = html`<input ...${comunes} type=${tipo === 'email' ? 'email' : tipo === 'clave' ? 'password' : tipo === 'fecha' ? 'date' : 'text'}
    inputmode=${tipo === 'dinero' || tipo === 'nit' || tipo === 'tel' ? 'numeric' : null} maxlength=${largo || 160} autocomplete=${tipo === 'clave' ? 'new-password' : 'off'} max=${tipo === 'fecha' ? hoyISO() : null} />`;
  return html`<${Campo} etiqueta=${rotulo} ayuda=${ayuda} error=${error} ancho=${ancho} para=${id}>${control}<//>`;
}

function Modal({ titulo, children, pie, cerrar, ancho }) {
  useEffect(() => { const k = (e) => { if (e.key === 'Escape' && cerrar) cerrar(); }; document.addEventListener('keydown', k); return () => document.removeEventListener('keydown', k); }, []);
  return html`<div class="velo" onMouseDown=${(e) => { if (e.target === e.currentTarget && cerrar) cerrar(); }}>
    <div class=${'modal' + (ancho ? ' ancho' : '')} role="dialog" aria-modal="true" aria-label=${titulo}><h2>${titulo}</h2><div class="cuerpo">${children}</div><div class="pie-form">${pie}</div></div>
  </div>`;
}

// Ejecuta una acción mostrando "ocupado" y avisando si falla. Devuelve true si salió bien.
function useAccion(avisar) {
  const [ocupado, setOcupado] = useState(false);
  const correr = useCallback(async (fn, exito) => {
    if (ocupado) return false;
    setOcupado(true);
    try { await fn(); if (exito) avisar(exito); return true; } catch (e) { if (!(e && (e.mensaje || /^auth\//.test(e.code || '')))) console.error(e); avisar(textoError(e), 'mal'); return false; } finally { setOcupado(false); }
  }, [ocupado]);
  return [ocupado, correr];
}

// ---------------------------------------------------------------------------------------- acceso
function Acceso({ titulo, sub, children, demo }) {
  return html`<div>
    ${demo ? html`<div class="demo">Modo demostración: los datos quedan solo en este navegador. No lo use con documentos reales.</div>` : null}
    <main class="acceso"><h1>${titulo}</h1><p class="tenue" style="margin-bottom:16px">${sub}</p><div class="tarjeta"><div class="cuerpo">${children}</div></div>
    <p class="pie">Clientes y crédito · ${VERSION}</p></main>
  </div>`;
}

function PantallaIngreso({ A, avisar }) {
  const [v, setV] = useState({ correo: '', clave: '' });
  const [ocupado, correr] = useAccion(avisar);
  const entrar = (e) => { e.preventDefault(); correr(() => A.ingresar(v.correo, v.clave)); };
  const recuperar = () => {
    if (!esCorreo(v.correo)) { avisar('Escriba primero su correo en la casilla de arriba.', 'mal'); return; }
    correr(() => A.recuperarClave(v.correo), 'Si ese correo tiene cuenta, le llegará un mensaje para crear una contraseña nueva. Revise también el correo no deseado.');
  };

function PantallaInstalacion({ A, avisar, alTerminar }) {

  const setV = (nv) => { ponerV(nv); if (Object.keys(err).length) setErr({}); };
  const [ocupado, correr] = useAccion(avisar);
  const crear = (e) => {
    e.preventDefault();
    const x = {};
    if (!limpio(v.empresa)) x.empresa = 'Escriba el nombre de la empresa.';
    if (!limpio(v.nombre)) x.nombre = 'Escriba su nombre.';
    if (!esCorreo(v.correo)) x.correo = 'Escriba un correo válido.';

      <${Texto} v=${v} c="clave" poner=${setV} etiqueta="Contraseña" tipo="clave" error=${err.clave} ayuda="Mínimo 8 caracteres. No use la de otra cuenta." />

}

function App({ A }) {
  const [fase, setFase] = useState('cargando'); // cargando | instalacion | ingreso | sin_acceso | dentro | error
  const [perfil, setPerfil] = useState(null);
  const [config, setConfig] = useState(CONFIG_DEFECTO);
  const [vista, setVista] = useState({ nombre: 'solicitudes' });
  const [avisos, setAvisos] = useState([]);
  const instalando = useRef(false);

  const avisar = useCallback((texto, tono) => {
    const id = idCorto();
    setAvisos((a) => a.concat({ id, texto, tono: tono || 'bien' }).slice(-3)); // como mucho tres avisos a la vez
    setTimeout(() => setAvisos((a) => a.filter((x) => x.id !== id)), tono === 'mal' ? 9000 : 4500);
  }, []);
  const ir = useCallback((v) => { setVista(v); window.scrollTo(0, 0); }, []);

  const cargarSesion = useCallback(async (usuario) => {
    try {
      if (!usuario) { A.fijarPerfil(null); setFase('cargando'); setPerfil(null); setAvisos((a) => a.filter((x) => /inactividad/.test(x.texto))); setFase((await A.instalado()) ? 'ingreso' : 'instalacion'); return; }
      const p = await A.perfilDe(usuario.uid);
      if (!p && !(await A.instalado())) { setFase('instalacion'); return; }
      if (!p || !p.activo || !(p.roles || []).length) { A.fijarPerfil(null); setPerfil({ uid: usuario.uid, correo: usuario.email }); setFase('sin_acceso'); return; }
      const completo = Object.assign({}, p, { uid: usuario.uid });
      // Si el administrador confirmó un cambio de su propio correo, su perfil se pone al día al entrar.
      const correoReal = String(usuario.email || '').toLowerCase();
      if (correoReal && completo.correo !== correoReal && completo.roles.includes('administrador')) {
        try { await A.guardarUsuario(usuario.uid, { correo: correoReal }); completo.correo = correoReal; } catch (e) { /* se intentará en el próximo ingreso */ }
      }
      A.fijarPerfil(completo); setPerfil(completo); setConfig(await A.config());
      setVista({ nombre: 'solicitudes' }); setFase('dentro');
    } catch (e) { console.error(e); avisar(textoError(e), 'mal'); setFase('error'); }
  }, []);
  useEffect(() => A.alCambiarSesion((u) => { if (!instalando.current) cargarSesion(u); }), []);

  // La instalación crea la cuenta y enseguida su perfil: mientras tanto se ignora el aviso de "sesión iniciada".
  const instalar = async (fn) => { instalando.current = true; try { await fn(); } finally { instalando.current = false; } await cargarSesion(A.usuarioActual()); };

  // Cierre de sesión por inactividad.
  useEffect(() => {
    if (fase !== 'dentro') return undefined;
    let t;
    const reiniciar = () => { clearTimeout(t); t = setTimeout(() => { A.salir(); avisar('La sesión se cerró por inactividad.'); }, MINUTOS_INACTIVIDAD * 60000); };
    const eventos = ['click', 'keydown', 'touchstart', 'mousemove'];
    eventos.forEach((e) => window.addEventListener(e, reiniciar, { passive: true })); reiniciar();
    return () => { clearTimeout(t); eventos.forEach((e) => window.removeEventListener(e, reiniciar)); };
  }, [fase]);

  const base = { A, perfil, config, avisar, ir };
  let cuerpo;
  if (fase === 'cargando') cuerpo = html`<p class="vacio">Cargando…</p>`;
  else if (fase === 'error') cuerpo = html`<${Acceso} titulo="No se pudo cargar" sub=""><p>No hubo conexión con la base de datos o falta terminar su configuración.</p><div class="pie-form"><button class="btn" onClick=${() => window.location.reload()}>Reintentar</button></div><//>`;
  else if (fase === 'instalacion') cuerpo = html`<${PantallaInstalacion} A=${A} avisar=${avisar} alTerminar=${instalar} />`;
  else if (fase === 'ingreso') cuerpo = html`<${PantallaIngreso} A=${A} avisar=${avisar} />`;
  else if (fase === 'sin_acceso') cuerpo = html`<${PantallaSinAcceso} A=${A} perfil=${perfil} />`;
  else {
    const esAdmin = tieneRol(perfil, 'administrador');
    let pagina;
    if (vista.nombre === 'detalle') pagina = html`<${FichaCliente} key=${vista.id} ...${base} id=${vista.id} />`;
    else if (vista.nombre === 'nueva') pagina = html`<${FormularioFicha} ...${base} />`;
    else if (vista.nombre === 'editar') pagina = html`<${FormularioFicha} key=${vista.sol.id} ...${base} sol=${vista.sol} />`;
    else if (vista.nombre === 'usuarios' && esAdmin) pagina = html`<${PantallaUsuarios} ...${base} />`;
    else if (vista.nombre === 'configuracion' && esAdmin) pagina = html`<${PantallaConfiguracion} ...${base} ponerConfig=${setConfig} />`;
    else if (vista.nombre === 'cuenta') pagina = html`<${PantallaCuenta} ...${base} />`;
    else pagina = html`<${ListaClientes} ...${base} />`;
    cuerpo = html`<${Marco} A=${A} perfil=${perfil} config=${config} vista=${vista} ir=${ir}>${pagina}<//>`;
  }
  return html`<div>${cuerpo}<div class="avisos" aria-live="polite">${avisos.map((a) => html`<div key=${a.id} class=${a.tono === 'mal' ? 'mal' : ''}>${a.texto}</div>`)}</div></div>`;
}

        ${pestana('tramite', 'En trámite', lista ? tramite.length : null)}

function FormularioFicha({ A, avisar, ir, sol }) {
  const soloDatos = Boolean(sol) && ESTADOS_FINALES.includes(sol.estado); // ficha ya decidida: solo se actualizan los datos del cliente
  const inicial = sol ? Object.assign({}, sol.cliente, {
    cupoSolicitado: fmtMiles(sol.credito.cupoSolicitado), plazoSolicitado: String(sol.credito.plazoSolicitado || ''),
    comprasMensuales: fmtMiles(sol.credito.comprasMensuales), tiempoRelacion: sol.credito.tiempoRelacion || '', nota: sol.credito.nota || '',
  }) : {};
  const [v, ponerV] = useState(inicial);
  const [err, setErr] = useState({});
  const setV = (nv) => { ponerV(nv); if (Object.keys(err).length) setErr({}); }; // al corregir se quitan los avisos de error
  const [ocupado, correr] = useAccion(avisar);
  const dv = calcularDv(v.nit);
  const volver = () => ir(sol ? { nombre: 'detalle', id: sol.id } : { nombre: 'solicitudes' });

  const guardar = (e) => {
    e.preventDefault();
    const x = {}, nit = sol ? sol.nit : soloDigitos(v.nit);
    if (!limpio(v.razonSocial)) x.razonSocial = 'Escriba la razón social o el nombre.';
    if (nit.length < 5 || nit.length > 10) x.nit = 'Escriba el NIT o la cédula sin puntos y sin el dígito de verificación.';
    ['correo', 'repCorreo', 'correoFacturacion'].forEach((k) => { if (limpio(v[k]) && !esCorreo(v[k])) x[k] = 'El correo no es válido.'; });
    setErr(x);
    if (Object.keys(x).length) { avisar('Revise los campos marcados.', 'mal'); return; }
    const cliente = { dv: calcularDv(nit) };
    Object.values(CAMPOS_CLIENTE).forEach((campos) => campos.forEach(([k, , , tipo]) => { cliente[k] = tipo === 'nit' ? nit : limpio(v[k]); }));
    const credito = { cupoSolicitado: aNumero(v.cupoSolicitado), plazoSolicitado: Number(v.plazoSolicitado) || 0, comprasMensuales: aNumero(v.comprasMensuales), tiempoRelacion: v.tiempoRelacion || '', nota: limpio(v.nota) };
    correr(async () => {
      if (!sol) { const r = await A.crearFicha({ cliente, credito }); ir({ nombre: 'detalle', id: r.id }); return; }
      await A.guardar(sol.id, soloDatos ? { cliente } : { cliente, credito }, 'Actualizó los datos de la ficha');
      ir({ nombre: 'detalle', id: sol.id });
    }, sol ? 'Datos guardados.' : 'Ficha creada. Ahora cargue los documentos.');
  };

  return html`<form onSubmit=${guardar} novalidate>
    <div class="encabezado">
      <div><button type="button" class="btn liso" onClick=${volver}><${Icono} n="atras" />Volver</button>

      <p class="sub">Registre la información que entregó el cliente. Puede guardar con lo básico y completar el resto después; los campos con * se exigen para enviar la ficha a estudio de crédito.</p></div>
    </div>
    <div class="tarjeta"><div class="cuerpo">
      ${Object.keys(CAMPOS_CLIENTE).map((grupo) => html`<h3 class="grupo">${grupo}</h3><div class="campos">
        ${CAMPOS_CLIENTE[grupo].map(([k, etiqueta, req, tipo, opciones]) => html`<${Texto} key=${k} v=${v} c=${k} poner=${setV} etiqueta=${etiqueta} requerido=${req} tipo=${tipo} opciones=${opciones}
          deshabilitado=${Boolean(sol) && k === 'nit'} error=${err[k]}
          ayuda=${k === 'nit' ? (sol ? 'El NIT identifica la ficha y no se puede cambiar.' : dv !== null ? 'Dígito de verificación calculado: ' + dv : null) : k === 'whatsapp' ? 'Con este número se abrirá WhatsApp para informar el resultado.' : null} />`)}
      </div>`)}
      ${soloDatos ? null : html`<h3 class="grupo">Crédito que solicita</h3>
      <div class="campos">
        <${Texto} v=${v} c="cupoSolicitado" poner=${setV} etiqueta="Cupo solicitado (pesos)" requerido=${true} tipo="dinero" />
        <${Texto} v=${v} c="plazoSolicitado" poner=${setV} etiqueta="Plazo de pago solicitado" requerido=${true} opciones=${PLAZOS.map((p) => [String(p), p + ' días'])} />
        <${Texto} v=${v} c="comprasMensuales" poner=${setV} etiqueta="Compras mensuales estimadas (pesos)" tipo="dinero" />
        <${Texto} v=${v} c="tiempoRelacion" poner=${setV} etiqueta="Tiempo de relación comercial" opciones=${TIEMPOS_RELACION} />
        <${Texto} v=${v} c="nota" poner=${setV} etiqueta="Observaciones del asesor" lineas=${3} ancho=${true} />
      </div>`}
      <div class="pie-form"><button class="btn" disabled=${ocupado}>${sol ? 'Guardar cambios' : 'Guardar y cargar documentos'}</button>
      <button type="button" class="btn sec" onClick=${volver}>Cancelar</button></div>
