async function reducirImagen(archivo) {
  // Las fotos de WhatsApp suelen pesar más de lo necesario: se reducen sin perder legibilidad para cuidar el espacio.
  try {
    if (archivo.size < 400 * 1024 || !window.createImageBitmap) return archivo;
    const bmp = await createImageBitmap(archivo);
    const escala = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
    const lienzo = document.createElement('canvas'); lienzo.width = Math.round(bmp.width * escala); lienzo.height = Math.round(bmp.height * escala);
    const ctx = lienzo.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, lienzo.width, lienzo.height); ctx.drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
    const blob = await new Promise((r) => lienzo.toBlob(r, 'image/jpeg', 0.82));
    if (!blob || blob.size >= archivo.size) return archivo;
    return new File([blob], archivo.name.replace(/\.[a-z0-9]+$/i, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return archivo; }
}
function descargarBlob(blob, nombre) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const nombreSeguro = (s) => limpio(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').slice(0, 90);

function resumenTexto(sol, config, historial) {
  const c = sol.cliente, cr = sol.credito, L = [];
  L.push(`${config.empresa} — Ficha de cliente`, `Estado: ${(ESTADOS[sol.estado] || {}).label} (estudio N.º ${sol.numeroEstudio})`, `Ficha creada: ${fmtFechaHora(sol.creado)} por ${sol.creadoNombre}`, '');
  L.push('CLIENTE', `Razón social: ${c.razonSocial}`, `NIT: ${fmtNit(c.nit, c.dv)}`);
  Object.values(CAMPOS_CLIENTE).forEach((campos) => campos.forEach(([k, etiqueta]) => { if (!['razonSocial', 'nit'].includes(k) && limpio(c[k])) L.push(`${etiqueta}: ${c[k]}`); }));
  L.push('', 'CRÉDITO QUE SOLICITA', `Cupo solicitado: ${fmtDinero(cr.cupoSolicitado)}`, `Plazo solicitado: ${cr.plazoSolicitado} días`);
  if (cr.comprasMensuales) L.push(`Compras mensuales estimadas: ${fmtDinero(cr.comprasMensuales)}`);
  if (cr.tiempoRelacion) L.push(`Tiempo de relación: ${cr.tiempoRelacion}`);
  if (cr.nota) L.push(`Observaciones del asesor: ${cr.nota}`);
  if (sol.revision) L.push('', 'REVISIÓN DE DOCUMENTOS', `${sol.revision.nombre}, ${fmtFechaHora(sol.revision.fecha)}`, sol.revision.nota || '');
  if (sol.evaluacion) L.push('', 'EVALUACIÓN FINANCIERA', `${sol.evaluacion.nombre}, ${fmtFechaHora(sol.evaluacion.fecha)}`, `Concepto: ${CONCEPTOS[sol.evaluacion.concepto]}`,
    `Cupo recomendado: ${fmtDinero(sol.evaluacion.cupoRecomendado)} a ${sol.evaluacion.plazoRecomendado} días`, sol.evaluacion.analisis || '');
  if (sol.decision) L.push('', 'DECISIÓN', `${sol.decision.nombre}, ${fmtFechaHora(sol.decision.fecha)}`,
    sol.decision.resultado === 'aprobada' ? `APROBADA: ${fmtDinero(sol.decision.cupoAprobado)} a ${sol.decision.plazoAprobado} días. ${sol.decision.condiciones || ''}` : `RECHAZADA. Motivo: ${sol.decision.motivo}`);
  if (sol.informado) L.push('', 'AVISO AL CLIENTE', `${sol.informado.nombre}, ${fmtFechaHora(sol.informado.fecha)} por ${sol.informado.medio}. ${sol.informado.nota || ''}`);
  (sol.estudios || []).forEach((e) => L.push('', 'ESTUDIO ANTERIOR N.º ' + e.numero, `Solicitó ${fmtDinero(e.credito.cupoSolicitado)} a ${e.credito.plazoSolicitado} días`,
    e.decision.resultado === 'aprobada' ? `APROBADO: ${fmtDinero(e.decision.cupoAprobado)} a ${e.decision.plazoAprobado} días. ${e.decision.condiciones || ''}` : `NO APROBADO. Motivo: ${e.decision.motivo}`, `${e.decision.nombre}, ${fmtFechaHora(e.decision.fecha)}`));
  L.push('', 'HISTORIAL');
  (historial || []).slice().reverse().forEach((h) => L.push(`${fmtFechaHora(h.fecha)} · ${h.nombre} · ${h.accion}${h.detalle ? ' · ' + h.detalle : ''}`));
  return L.join('\r\n');
}

// ---------------------------------------------------------------------------------------- expediente
function EtiquetaVigencia({ doc, tipo }) {
  const v = vigenciaDe(doc, tipo);
  if (v.estado === 'no_vence') return html`<span class="tenue chica">No vence</span>`;
  if (v.estado === 'sin_fecha') return html`<${Etiqueta} tono="aviso">Falta la fecha de expedición<//>`;
  if (v.estado === 'vencido') return html`<${Etiqueta} tono="mal">Vencido el ${fmtFecha(v.vence)}<//>`;
  if (v.estado === 'por_vencer') return html`<${Etiqueta} tono="aviso">Vence el ${fmtFecha(v.vence)}<//>`;
  return html`<${Etiqueta} tono="bien">Vigente hasta ${fmtFecha(v.vence)}<//>`;
}

function ModalCarga({ tipo, actual, anexo, alCargar, cerrar, avisar }) {
  const [archivo, setArchivo] = useState(null);
  const [v, setV] = useState({ fecha: (actual && actual.fechaExpedicion) || '', nombre: '' });
  const [avance, setAvance] = useState(null);
  const [ocupado, correr] = useAccion(avisar);
  const pideFecha = !anexo && Boolean(tipo.vigencia);
  const cargar = (e) => {
    e.preventDefault();
    correr(async () => {
      if (anexo && !limpio(v.nombre)) throw fallo('Escriba qué documento es.');
      if (!archivo) throw fallo('Elija el archivo.');
      if (pideFecha && !v.fecha) throw fallo('Indique la fecha de expedición que aparece en el documento.');
      if (pideFecha && v.fecha > hoyISO()) throw fallo('La fecha de expedición no puede ser futura.');
      setAvance(0);
      try { await alCargar(anexo ? { codigo: 'otro_' + idCorto(), nombre: limpio(v.nombre), vigencia: null } : tipo, archivo, pideFecha ? v.fecha : '', setAvance); } finally { setAvance(null); }
      cerrar();
    }, 'Documento cargado.');
  };
  return html`<${Modal} titulo=${anexo ? 'Agregar otro documento' : (actual && actual.archivoId ? 'Reemplazar: ' : 'Cargar: ') + tipo.nombre} cerrar=${ocupado ? null : cerrar}
    pie=${html`<button class="btn" form="form-carga" disabled=${ocupado}><${Icono} n="subir" />${ocupado ? 'Cargando…' : 'Cargar'}</button><button class="btn sec" onClick=${cerrar} disabled=${ocupado}>Cancelar</button>`}>
    <form id="form-carga" onSubmit=${cargar}>
      ${anexo ? html`<${Texto} v=${v} c="nombre" poner=${setV} etiqueta="¿Qué documento es?" largo=${80} />` : tipo.ayuda ? html`<p class="tenue chica" style="margin-bottom:10px">${tipo.ayuda}</p>` : null}
      <${Campo} etiqueta="Archivo (PDF, JPG o PNG, máximo ${MAX_ARCHIVO_MB} MB)" para="f-archivo">
        <input id="f-archivo" class="entrada" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" onChange=${(e) => setArchivo(e.target.files[0] || null)} />
      <//>
      ${pideFecha ? html`<div style="margin-top:12px"><${Texto} v=${v} c="fecha" poner=${setV} etiqueta="Fecha de expedición del documento" tipo="fecha" ayuda=${'Este documento sirve durante ' + tipo.vigencia + ' días desde esa fecha.'} /></div>` : null}
      ${avance !== null ? html`<div class="progreso" role="progressbar" aria-valuenow=${Math.round(avance * 100)}><i style=${'width:' + Math.round(avance * 100) + '%'}></i></div>` : null}
    </form>
  <//>`;
}

function FichaCliente({ A, perfil, config, avisar, ir, id }) {
  const [sol, setSol] = useState(undefined); // undefined = cargando, null = no existe
  const [historial, setHistorial] = useState([]);
  const [modal, setModal] = useState(null);
  const [ocupado, correr] = useAccion(avisar);
  const recargar = useCallback(async () => {
    try { const s = await A.ficha(id); setSol(s); if (s) setHistorial(await A.historial(id)); } catch (e) { avisar(textoError(e), 'mal'); setSol(null); }
  }, [id]);
  useEffect(() => { recargar(); }, [id]);
  // Si otra persona movió la ficha, la acción falla: se recarga para mostrar el estado real.
  const actuar = (fn, exito) => correr(fn, exito).then((ok) => { recargar(); return ok; });

  if (sol === undefined) return html`<p class="vacio">Cargando…</p>`;
  if (sol === null) return html`<div class="tarjeta"><p class="vacio">Esa ficha no existe o fue eliminada.</p><p class="vacio"><button class="btn sec" onClick=${() => ir({ nombre: 'solicitudes' })}>Volver a la lista</button></p></div>`;

  const c = sol.cliente, cr = sol.credito, filas = filasDocumentos(sol, config), anteriores = sol.estudios || [];
  const final = ESTADOS_FINALES.includes(sol.estado), esAsesor = tieneRol(perfil, 'asesor');
  const puedo = {
    preparar: esAsesor && ESTADOS_ASESOR.includes(sol.estado),  // completar la ficha y enviarla a estudio
    mantener: esAsesor && final,                                 // ficha ya decidida: actualizar datos y documentos
    revisar: tieneRol(perfil, 'revisor') && sol.estado === 'en_revision',
    evaluar: tieneRol(perfil, 'financiero') && sol.estado === 'en_evaluacion',
    decidir: tieneRol(perfil, 'gerencia') && sol.estado === 'pendiente_aprobacion',
    informar: esAsesor && final && !sol.informado,
    nuevoEstudio: esAsesor && final && Boolean(sol.informado),
    liberar: tieneRol(perfil, 'administrador') && final && bytesDeSolicitud(sol) > 0,
  };
  const editaDocs = puedo.preparar || puedo.mantener;
  const vigente = ultimaDecision(sol);
  const paso = ESTADOS[sol.estado].paso;
  const claseRuta = (i) => (sol.estado === 'rechazada' && i === 4 ? 'mal' : i < paso || (final && sol.informado) ? 'hecho' : i === paso ? 'actual' : '');
  const firma = () => ({ por: perfil.uid, nombre: perfil.nombre, fecha: ahoraISO() });

  // ---- documentos
  const cargarDoc = async (tipo, archivo, fechaExp, alAvanzar) => {
    if (!TIPOS_ARCHIVO[archivo.type]) throw fallo('Solo se admiten archivos PDF, JPG o PNG.');
    const f = archivo.type === 'application/pdf' ? archivo : await reducirImagen(archivo);
    if (f.size > MAX_ARCHIVO_MB * 1048576) throw fallo('El archivo pesa ' + fmtTamano(f.size) + ' y el máximo es ' + MAX_ARCHIVO_MB + ' MB. Pida una versión más liviana o divídalo.');
    if (!f.size) throw fallo('El archivo está vacío.');
    const anterior = (sol.docs || {})[tipo.codigo];
    const meta = await A.subirArchivo(sol.id, tipo.codigo, f, alAvanzar);
    await A.guardar(sol.id, { ['docs.' + tipo.codigo]: Object.assign(meta, { nombreTipo: tipo.nombre, fechaExpedicion: fechaExp || '', subidoPor: perfil.uid, subidoNombre: perfil.nombre, subidoEn: ahoraISO(), revision: null }) },
      anterior && anterior.archivoId ? 'Reemplazó un documento' : 'Cargó un documento', tipo.nombre);
    if (anterior && anterior.archivoId) { try { await A.borrarArchivo(anterior.archivoId, anterior.partes); } catch (e) { /* el archivo viejo queda sin uso */ } }
    await recargar();
  };
  const quitarDoc = (tipo, doc) => actuar(async () => {
    await A.guardar(sol.id, { ['docs.' + tipo.codigo]: A.campoBorrado() }, 'Quitó un documento', tipo.nombre);
    if (doc.archivoId) { try { await A.borrarArchivo(doc.archivoId, doc.partes); } catch (e) { /* queda sin uso */ } }
  }, 'Documento quitado.');
  const verDoc = (doc, descargar) => correr(async () => {
    const blob = await A.leerArchivo(doc);
    if (descargar) descargarBlob(blob, doc.nombre); else setModal({ tipo: 'ver', url: URL.createObjectURL(blob), doc });
  });
  const cerrarVisor = () => { URL.revokeObjectURL(modal.url); setModal(null); };
  const descargarZip = () => correr(async () => {
    const zip = new window.JSZip(), carpeta = nombreSeguro(c.razonSocial + ' NIT ' + sol.nit);
    for (const { tipo, doc } of filas) if (doc && doc.archivoId) zip.file(carpeta + '/' + nombreSeguro(tipo.nombre) + ' - ' + nombreSeguro(doc.nombre), await A.leerArchivo(doc));
    zip.file(carpeta + '/Resumen de la ficha.txt', resumenTexto(sol, config, historial));
    descargarBlob(await zip.generateAsync({ type: 'blob' }), carpeta + '.zip');
  }, 'Expediente descargado.');

  // ---- pasos del asesor
  const faltan = faltantes(sol, config);
  const enviar = () => actuar(async () => {
    if (faltan.length) throw fallo('Todavía falta: ' + faltan[0]);
    await A.guardar(sol.id, { estado: 'en_revision', enviado: firma() }, sol.estado === 'devuelta' ? 'Reenvió la ficha a revisión' : 'Envió la ficha a estudio de crédito', 'Estudio N.º ' + sol.numeroEstudio);
  }, 'Ficha enviada a revisión de documentos.');
  const eliminar = () => correr(async () => { await A.eliminarFicha(sol); ir({ nombre: 'solicitudes' }); }, 'Ficha eliminada.');
  // Nuevo estudio (renovación o cambio de cupo): el estudio actual se archiva tal cual y la ficha vuelve a preparación.
  const nuevoEstudio = () => actuar(async () => {
    const docs = {}; Object.keys(sol.docs || {}).forEach((k) => { docs[k] = Object.assign({}, sol.docs[k], { revision: null }); });
    const archivado = { numero: sol.numeroEstudio, credito: sol.credito, enviado: sol.enviado, revision: sol.revision, evaluacion: sol.evaluacion, decision: sol.decision, informado: sol.informado };
    await A.guardar(sol.id, { estado: 'borrador', abierta: true, estudios: anteriores.concat(archivado), numeroEstudio: sol.numeroEstudio + 1, enviado: null, revision: null, evaluacion: null, decision: null, devolucion: null, informado: null, docs },
      'Inició un nuevo estudio de crédito', 'Estudio N.º ' + (sol.numeroEstudio + 1));
    setModal(null);
  }, 'Nuevo estudio iniciado. Actualice el cupo solicitado y los documentos, y envíe la ficha.');

  return html`<div>
    <div class="encabezado">
      <div><button class="btn liso" onClick=${() => ir({ nombre: 'solicitudes' })}><${Icono} n="atras" />Clientes</button>
      <h1>${c.razonSocial}</h1>
      <p class="sub">NIT <span class="mono">${fmtNit(sol.nit, c.dv)}</span>${c.ciudad ? ' · ' + c.ciudad : ''} · ficha creada el ${fmtFecha(sol.creado)} por ${sol.creadoNombre}</p></div>
      <div class="acciones"><${EtiquetaEstado} estado=${sol.estado} /></div>
    </div>

    <div class="tarjeta"><div class="cab"><h2>Crédito</h2></div><div class="cuerpo">
      ${!vigente ? html`<p class="tenue">Este cliente todavía no tiene un estudio de crédito decidido.</p>` : html`<dl class="datos">
        ${vigente.resultado === 'aprobada' ? html`<div><dt>Cupo aprobado</dt><dd><b style="font-size:19px">${fmtDinero(vigente.cupoAprobado)}</b></dd></div><div><dt>Plazo de pago</dt><dd><b style="font-size:19px">${vigente.plazoAprobado} días</b></dd></div>
          ${vigente.condiciones ? html`<div><dt>Condiciones</dt><dd>${vigente.condiciones}</dd></div>` : null}`
        : html`<div><dt>Resultado</dt><dd><${Etiqueta} tono="mal">Crédito no aprobado<//></dd></div><div><dt>Motivo</dt><dd>${vigente.motivo}</dd></div>`}
        <div><dt>Decidió</dt><dd>${vigente.nombre}, ${fmtFechaHora(vigente.fecha)} (estudio N.º ${vigente.numero})</dd></div>
        ${sol.decision ? html`<div><dt>Aviso al cliente</dt><dd>${sol.informado ? html`${sol.informado.nombre}, ${fmtFechaHora(sol.informado.fecha)} por ${sol.informado.medio}${sol.informado.nota ? '. ' + sol.informado.nota : ''}` : html`<${Etiqueta} tono="aviso">Pendiente<//>`}</dd></div>` : null}
      </dl>`}
      ${!sol.decision && anteriores.length ? html`<p class="tenue chica" style="margin-top:10px">Hay un nuevo estudio en curso (N.º ${sol.numeroEstudio}). Mientras se decide, rige la decisión anterior.</p>` : null}
    </div></div>

    ${sol.abierta ? html`<ol class="ruta" aria-label=${'Avance del estudio N.º ' + sol.numeroEstudio}>${RUTA.map((r, i) => html`<li key=${r} class=${claseRuta(i + 1)}>${r}</li>`)}</ol>` : null}

    ${sol.estado === 'devuelta' && sol.devolucion ? html`<${Alerta} tono="aviso"><b>Devuelta por ${sol.devolucion.nombre} (${sol.devolucion.etapa}), ${fmtFechaHora(sol.devolucion.fecha)}.</b> ${sol.devolucion.motivo}<//>` : null}

    ${puedo.preparar ? html`<div class="tarjeta destacada"><div class="cab"><h2>Su turno: completar la ficha y enviarla a estudio</h2>
      <p>Cargue los documentos que entregó el cliente y, cuando no falte nada, envíe la ficha a estudio de crédito${sol.numeroEstudio > 1 ? ' (estudio N.º ' + sol.numeroEstudio + ')' : ''}.</p></div><div class="cuerpo">
      ${faltan.length ? html`<${Alerta} tono="aviso"><b>Falta para poder enviar:</b><ul style="margin-top:4px">${faltan.slice(0, 8).map((f) => html`<li key=${f}>· ${f}</li>`)}${faltan.length > 8 ? html`<li>· y ${faltan.length - 8} más</li>` : null}</ul><//>` : html`<${Alerta} tono="bien">Todo completo. Ya puede enviarla a estudio.<//>`}
      <div class="fila"><button class="btn" disabled=${ocupado || faltan.length > 0} onClick=${enviar}>Enviar a estudio de crédito</button>
      <button class="btn sec" onClick=${() => ir({ nombre: 'editar', sol })}><${Icono} n="lapiz" />Editar datos</button>
      ${sol.estado === 'borrador' && !anteriores.length ? html`<button class="btn sec empuja" onClick=${() => setModal({ tipo: 'eliminar' })}><${Icono} n="basura" />Eliminar ficha</button>` : null}</div>
    </div></div>` : null}

    ${puedo.revisar ? html`<${PanelRevisor} sol=${sol} filas=${filas} firma=${firma} A=${A} actuar=${actuar} ocupado=${ocupado} verDoc=${verDoc} />` : null}
    ${puedo.evaluar ? html`<${PanelFinanciero} sol=${sol} perfil=${perfil} firma=${firma} A=${A} actuar=${actuar} ocupado=${ocupado} />` : null}
    ${puedo.decidir ? html`<${PanelGerencia} sol=${sol} perfil=${perfil} firma=${firma} A=${A} actuar=${actuar} ocupado=${ocupado} />` : null}
    ${puedo.informar ? html`<${PanelAviso} sol=${sol} config=${config} firma=${firma} A=${A} actuar=${actuar} ocupado=${ocupado} avisar=${avisar} />` : null}
    ${puedo.nuevoEstudio ? html`<div class="tarjeta"><div class="cab"><h2>Mantener la ficha al día</h2>
      <p>Puede actualizar los datos de contacto y reemplazar documentos vencidos en cualquier momento. Para renovar el crédito o cambiar el cupo, inicie un nuevo estudio.</p></div><div class="cuerpo"><div class="fila">
      <button class="btn sec" onClick=${() => ir({ nombre: 'editar', sol })}><${Icono} n="lapiz" />Editar datos</button>
      <button class="btn" onClick=${() => setModal({ tipo: 'estudio' })}><${Icono} n="mas" />Iniciar un nuevo estudio de crédito</button></div></div></div>` : null}
    ${sol.abierta && !final && !puedo.preparar && !puedo.revisar && !puedo.evaluar && !puedo.decidir ? html`<${Alerta} tono="info">Esta ficha está en manos de <b>${ROLES[TURNO[sol.estado]]}</b>. Usted puede consultarla, pero no modificarla.<//>` : null}

    ${sol.evaluacion ? html`<div class="tarjeta"><div class="cab"><h2>Evaluación financiera</h2></div><div class="cuerpo"><dl class="datos">
      <div><dt>Concepto</dt><dd><b>${CONCEPTOS[sol.evaluacion.concepto]}</b></dd></div>
      <div><dt>Cupo recomendado</dt><dd>${fmtDinero(sol.evaluacion.cupoRecomendado)}</dd></div><div><dt>Plazo recomendado</dt><dd>${sol.evaluacion.plazoRecomendado ? sol.evaluacion.plazoRecomendado + ' días' : '—'}</dd></div>
      <div><dt>Evaluó</dt><dd>${sol.evaluacion.nombre}, ${fmtFechaHora(sol.evaluacion.fecha)}</dd></div>
    </dl><p style="margin-top:12px;white-space:pre-wrap">${sol.evaluacion.analisis}</p></div></div>` : null}

    ${sol.revision ? html`<div class="tarjeta"><div class="cab"><h2>Revisión de documentos</h2></div><div class="cuerpo">
      <p><${Etiqueta} tono="bien">Documentos conformes<//> ${sol.revision.nombre}, ${fmtFechaHora(sol.revision.fecha)}</p>${sol.revision.nota ? html`<p style="margin-top:8px;white-space:pre-wrap">${sol.revision.nota}</p>` : null}</div></div>` : null}

    <div class="tarjeta"><div class="cab"><h2>Documentos</h2>
      <div class="empuja fila">
        ${filas.some((f) => f.doc && f.doc.archivoId) ? html`<button class="btn sec chico" disabled=${ocupado} onClick=${descargarZip}><${Icono} n="bajar" />Descargar todo (ZIP)</button>` : null}
        ${editaDocs ? html`<button class="btn sec chico" onClick=${() => setModal({ tipo: 'carga', anexo: true, tipoDoc: {} })}><${Icono} n="mas" />Agregar otro documento</button>` : null}
        ${puedo.liberar ? html`<button class="btn sec chico" onClick=${() => setModal({ tipo: 'liberar' })}><${Icono} n="basura" />Eliminar archivos</button>` : null}
      </div></div>
      <div class="tabla-caja"><table class="tabla"><thead><tr><th>Documento</th><th>Vigencia</th><th>Revisión</th>${editaDocs ? html`<th></th>` : null}</tr></thead>
      <tbody>${filas.map(({ tipo, doc }) => html`<tr key=${tipo.codigo}>
        <td><span class="doc-nombre">${tipo.nombre}</span> ${tipo.obligatorio ? null : html`<span class="tenue chica">(opcional)</span>`}
          ${doc && doc.archivoId ? html`<div class="doc-archivo"><${Icono} n="archivo" /><span>${doc.nombre} · ${fmtTamano(doc.tamano)}</span>
            <button class="btn liso chico" disabled=${ocupado} onClick=${() => verDoc(doc, false)}><${Icono} n="ojo" />Ver</button>
            <button class="btn liso chico" disabled=${ocupado} onClick=${() => verDoc(doc, true)}><${Icono} n="bajar" />Descargar</button></div>
            <div class="tenue chica">Cargado por ${doc.subidoNombre}, ${fmtFecha(doc.subidoEn)}${doc.fechaExpedicion ? ' · expedido el ' + fmtFecha(doc.fechaExpedicion) : ''}</div>`
          : doc && doc.eliminado ? html`<div class="tenue chica">${doc.nombre}: archivo eliminado el ${fmtFecha(doc.eliminadoEn)} para liberar espacio.</div>`
          : html`<div class="tenue chica">${tipo.obligatorio ? 'Sin cargar' : 'No se cargó'}</div>`}</td>
        <td>${doc && doc.archivoId ? html`<${EtiquetaVigencia} doc=${doc} tipo=${tipo} />` : null}</td>
        <td>${doc && doc.revision ? html`<${Etiqueta} tono=${doc.revision.estado === 'conforme' ? 'bien' : 'mal'}>${doc.revision.estado === 'conforme' ? 'Conforme' : 'Por corregir'}<//>${doc.revision.nota ? html`<div class="chica" style="margin-top:3px">${doc.revision.nota}</div>` : null}` : doc && doc.archivoId ? html`<span class="tenue chica">Sin revisar</span>` : null}</td>
        ${editaDocs ? html`<td style="white-space:nowrap;text-align:right">
          <button class="btn sec chico" onClick=${() => setModal({ tipo: 'carga', tipoDoc: tipo, actual: doc })}><${Icono} n="subir" />${doc && doc.archivoId ? 'Reemplazar' : 'Cargar'}</button>
          ${doc ? html` <button class="btn liso chico" disabled=${ocupado} onClick=${() => quitarDoc(tipo, doc)}>Quitar</button>` : null}</td>` : null}
      </tr>`)}</tbody></table></div>
    </div>

    <div class="tarjeta"><div class="cab"><h2>Datos del cliente</h2>${puedo.preparar || puedo.mantener ? html`<button class="btn sec chico empuja" onClick=${() => ir({ nombre: 'editar', sol })}><${Icono} n="lapiz" />Editar</button>` : null}</div><div class="cuerpo">
      ${Object.keys(CAMPOS_CLIENTE).map((grupo) => html`<h3 class="grupo">${grupo}</h3><dl class="datos">
        ${CAMPOS_CLIENTE[grupo].map(([k, etiqueta]) => html`<div key=${k}><dt>${k === 'nit' ? 'NIT o cédula' : etiqueta}</dt><dd>${k === 'nit' ? fmtNit(sol.nit, c.dv) : limpio(c[k]) || '—'}</dd></div>`)}</dl>`)}
      <h3 class="grupo">Crédito que solicita${anteriores.length ? ' (estudio N.º ' + sol.numeroEstudio + ')' : ''}</h3><dl class="datos">
        <div><dt>Cupo solicitado</dt><dd><b>${fmtDinero(cr.cupoSolicitado || null)}</b></dd></div><div><dt>Plazo solicitado</dt><dd>${cr.plazoSolicitado ? cr.plazoSolicitado + ' días' : '—'}</dd></div>
        <div><dt>Compras mensuales estimadas</dt><dd>${fmtDinero(cr.comprasMensuales || null)}</dd></div><div><dt>Tiempo de relación comercial</dt><dd>${cr.tiempoRelacion || '—'}</dd></div>
      </dl>${cr.nota ? html`<p style="margin-top:12px"><span class="tenue chica">Observaciones del asesor</span><br />${cr.nota}</p>` : null}
    </div></div>

    ${anteriores.length ? html`<div class="tarjeta"><div class="cab"><h2>Estudios anteriores</h2></div>
      <div class="tabla-caja"><table class="tabla"><thead><tr><th>Estudio</th><th>Solicitó</th><th>Resultado</th><th>Decidió</th></tr></thead>
      <tbody>${anteriores.slice().reverse().map((e) => html`<tr key=${e.numero}>
        <td class="mono">N.º ${e.numero}</td>
        <td>${fmtDinero(e.credito.cupoSolicitado)} a ${e.credito.plazoSolicitado} días</td>
        <td>${e.decision.resultado === 'aprobada' ? html`<${Etiqueta} tono="bien">Aprobado<//> ${fmtDinero(e.decision.cupoAprobado)} a ${e.decision.plazoAprobado} días` : html`<${Etiqueta} tono="mal">No aprobado<//> ${e.decision.motivo}`}</td>
        <td>${e.decision.nombre}, ${fmtFecha(e.decision.fecha)}</td>
      </tr>`)}</tbody></table></div></div>` : null}

    <div class="tarjeta"><div class="cab"><h2>Historial</h2><p>Queda registrado quién hizo cada cosa y cuándo. No se puede editar.</p></div><div class="cuerpo">
      <ul class="historial">${historial.map((h) => html`<li key=${h.id}><span class="tenue">${fmtFechaHora(h.fecha)}</span><span><b>${h.nombre}</b> · ${h.accion}${h.detalle ? html`<span class="tenue"> · ${h.detalle}</span>` : null}</span></li>`)}</ul>
    </div></div>

    ${modal && modal.tipo === 'carga' ? html`<${ModalCarga} tipo=${modal.tipoDoc} actual=${modal.actual} anexo=${modal.anexo} alCargar=${cargarDoc} cerrar=${() => setModal(null)} avisar=${avisar} />` : null}
    ${modal && modal.tipo === 'eliminar' ? html`<${Modal} titulo="Eliminar la ficha" cerrar=${() => setModal(null)}
      pie=${html`<button class="btn mal" disabled=${ocupado} onClick=${eliminar}>Sí, eliminar</button><button class="btn sec" onClick=${() => setModal(null)}>Cancelar</button>`}>
      <p>Se borrará la ficha de ${c.razonSocial} con los documentos que tenga cargados. Esto no se puede deshacer.</p><//>` : null}
    ${modal && modal.tipo === 'estudio' ? html`<${Modal} titulo="Iniciar un nuevo estudio de crédito" cerrar=${() => setModal(null)}
      pie=${html`<button class="btn" disabled=${ocupado} onClick=${nuevoEstudio}>Iniciar el estudio N.º ${sol.numeroEstudio + 1}</button><button class="btn sec" onClick=${() => setModal(null)}>Cancelar</button>`}>
      <p>Se conservan los datos y los documentos del cliente. La decisión actual pasa a “Estudios anteriores” y sigue rigiendo hasta que gerencia decida el nuevo estudio.</p>
      <p class="tenue" style="margin-top:8px">Después actualice el cupo solicitado, reemplace los documentos vencidos y envíe la ficha a estudio.</p><//>` : null}
    ${modal && modal.tipo === 'ver' ? html`<${Modal} titulo=${modal.doc.nombreTipo || modal.doc.nombre} ancho=${true} cerrar=${cerrarVisor}
      pie=${html`<button class="btn" onClick=${cerrarVisor}>Cerrar</button><a class="btn sec" href=${modal.url} download=${modal.doc.nombre}><${Icono} n="bajar" />Descargar</a><span class="tenue chica">Si el documento no se ve aquí, descárguelo.</span>`}>
      ${modal.doc.tipo === 'application/pdf' ? html`<iframe class="visor" src=${modal.url} title=${modal.doc.nombre}></iframe>` : html`<img class="visor" src=${modal.url} alt=${modal.doc.nombre} />`}<//>` : null}
    ${modal && modal.tipo === 'liberar' ? html`<${ModalLiberar} sol=${sol} A=${A} actuar=${actuar} ocupado=${ocupado} cerrar=${() => setModal(null)} descargarZip=${descargarZip} />` : null}
  </div>`;
}

// ===================================================================================================
// 6. LOS PASOS: revisión de documentos, evaluación financiera, decisión y aviso al cliente
// ===================================================================================================
function PanelRevisor({ sol, filas, firma, A, actuar, ocupado, verDoc }) {
  const cargados = filas.filter((f) => f.doc && f.doc.archivoId);
  const [ver, setVer] = useState(() => { const o = {}; cargados.forEach(({ tipo }) => { o[tipo.codigo] = { estado: '', nota: '' }; }); return o; });
  const [v, setV] = useState({ nota: '', motivo: '' });
  const poner = (codigo, cambios) => setVer((x) => Object.assign({}, x, { [codigo]: Object.assign({}, x[codigo], cambios) }));
  const de = (codigo) => ver[codigo] || { estado: '', nota: '' };
  const sinMarcar = cargados.filter(({ tipo }) => !de(tipo.codigo).estado);
  const malos = cargados.filter(({ tipo }) => de(tipo.codigo).estado === 'no_conforme');
  const vencidos = cargados.filter(({ tipo, doc }) => vigenciaDe(doc, tipo).estado === 'vencido');
  const faltan = filas.filter(({ tipo, doc }) => tipo.obligatorio && !(doc && doc.archivoId));
  const hayProblema = malos.length || vencidos.length || faltan.length;
  // El veredicto de cada documento queda guardado junto al documento.
  const docsCon = () => {
    const d = {};
    Object.keys(sol.docs || {}).forEach((c) => { const x = sol.docs[c]; d[c] = Object.assign({}, x, { revision: x.archivoId && de(c).estado ? { estado: de(c).estado, nota: limpio(de(c).nota) } : null }); });
    return d;
  };
  const aprobar = () => actuar(async () => {
    if (sinMarcar.length) throw fallo('Marque cada documento como conforme o por corregir.');
    if (hayProblema) throw fallo('Hay documentos por corregir, vencidos o faltantes: devuelva la ficha al asesor.');
    await A.guardar(sol.id, { estado: 'en_evaluacion', docs: docsCon(), revision: Object.assign(firma(), { nota: limpio(v.nota) }) }, 'Aprobó la revisión de documentos', limpio(v.nota));
  }, 'Documentos conformes. La ficha pasó a evaluación financiera.');
  const devolver = () => actuar(async () => {
    if (malos.some(({ tipo }) => !limpio(de(tipo.codigo).nota))) throw fallo('Explique qué hay que corregir en cada documento marcado.');
    if (!limpio(v.motivo)) throw fallo('Escriba el motivo de la devolución.');
    await A.guardar(sol.id, { estado: 'devuelta', docs: docsCon(), devolucion: Object.assign(firma(), { motivo: limpio(v.motivo), etapa: 'Revisión de documentos' }) }, 'Devolvió la ficha al asesor', limpio(v.motivo));
  }, 'Ficha devuelta al asesor.');

  return html`<div class="tarjeta destacada"><div class="cab"><h2>Su turno: revisar los documentos</h2>
    <p>Abra cada documento y marque si está completo, legible y vigente. Si todos están conformes, la ficha pasa a evaluación financiera.</p></div>
    <div class="tabla-caja"><table class="tabla"><thead><tr><th>Documento</th><th>Vigencia</th><th>¿Está conforme?</th><th>Qué hay que corregir</th></tr></thead>
    <tbody>${cargados.map(({ tipo, doc }) => html`<tr key=${tipo.codigo}>
      <td><span class="doc-nombre">${tipo.nombre}</span><div class="doc-archivo"><span class="tenue">${doc.nombre}</span><button class="btn liso chico" disabled=${ocupado} onClick=${() => verDoc(doc, false)}><${Icono} n="ojo" />Ver</button></div></td>
      <td><${EtiquetaVigencia} doc=${doc} tipo=${tipo} /></td>
      <td><div class="opciones" role="radiogroup" aria-label=${tipo.nombre}>
        <label><input type="radio" name=${'rev-' + tipo.codigo} checked=${de(tipo.codigo).estado === 'conforme'} onChange=${() => poner(tipo.codigo, { estado: 'conforme' })} />Conforme</label>
        <label><input type="radio" name=${'rev-' + tipo.codigo} checked=${de(tipo.codigo).estado === 'no_conforme'} onChange=${() => poner(tipo.codigo, { estado: 'no_conforme' })} />Por corregir</label></div></td>
      <td>${de(tipo.codigo).estado === 'no_conforme' ? html`<input class="entrada" aria-label=${'Qué corregir en ' + tipo.nombre} maxlength="300" value=${de(tipo.codigo).nota} onInput=${(e) => poner(tipo.codigo, { nota: e.target.value })} />` : null}</td>
    </tr>`)}</tbody></table></div>
    <div class="cuerpo">
      ${faltan.length ? html`<${Alerta} tono="aviso"><b>Faltan documentos obligatorios:</b> ${faltan.map((f) => f.tipo.nombre).join('; ')}.<//>` : null}
      ${vencidos.length ? html`<${Alerta} tono="aviso"><b>Documentos vencidos:</b> ${vencidos.map((f) => f.tipo.nombre).join('; ')}.<//>` : null}
      <div class="campos">
        ${hayProblema ? html`<${Texto} v=${v} c="motivo" poner=${setV} etiqueta="Motivo de la devolución (lo verá el asesor)" lineas=${2} ancho=${true} largo=${600} />`
          : html`<${Texto} v=${v} c="nota" poner=${setV} etiqueta="Observaciones de la revisión (opcional)" lineas=${2} ancho=${true} largo=${600} />`}
      </div>
      <div class="pie-form">
        ${hayProblema ? html`<button class="btn" disabled=${ocupado} onClick=${devolver}>Devolver al asesor</button>`
          : html`<button class="btn" disabled=${ocupado || sinMarcar.length > 0} onClick=${aprobar}>Documentos conformes: pasar a evaluación</button>`}
        ${sinMarcar.length && !hayProblema ? html`<span class="tenue chica">Faltan ${sinMarcar.length} por marcar.</span>` : null}
      </div>
    </div>
  </div>`;
}

// Devolución al asesor desde evaluación o desde gerencia.
function Devolver({ sol, etapa, firma, A, actuar, ocupado }) {
  const [abierto, setAbierto] = useState(false);
  const [v, setV] = useState({ motivo: '' });
  const devolver = () => actuar(async () => {
    if (!limpio(v.motivo)) throw fallo('Escriba qué debe corregir o completar el asesor.');
    await A.guardar(sol.id, { estado: 'devuelta', devolucion: Object.assign(firma(), { motivo: limpio(v.motivo), etapa }) }, 'Devolvió la ficha al asesor', limpio(v.motivo));
  }, 'Ficha devuelta al asesor.');
  if (!abierto) return html`<button class="btn sec empuja" onClick=${() => setAbierto(true)}>Devolver al asesor</button>`;
  return html`<div style="flex-basis:100%;margin-top:6px"><div class="campos"><${Texto} v=${v} c="motivo" poner=${setV} etiqueta="¿Qué debe corregir o completar el asesor?" lineas=${2} ancho=${true} largo=${600} /></div>
    <div class="pie-form"><button class="btn" disabled=${ocupado} onClick=${devolver}>Devolver al asesor</button><button class="btn sec" onClick=${() => setAbierto(false)}>Cancelar</button>
    <span class="tenue chica">Al devolverla, la ficha vuelve a pasar por revisión de documentos.</span></div></div>`;
}

function PanelFinanciero({ sol, perfil, firma, A, actuar, ocupado }) {
  const [v, setV] = useState({ concepto: '', cupo: fmtMiles(sol.credito.cupoSolicitado), plazo: String(sol.credito.plazoSolicitado || ''), analisis: '' });
  if (sol.revision && sol.revision.por === perfil.uid) {
    return html`<${Alerta} tono="aviso"><b>Esta evaluación debe hacerla otra persona.</b> Usted hizo la revisión de documentos de este estudio, y la revisión, la evaluación y la aprobación deben estar en manos de tres personas distintas.<//>`;
  }
  const enviar = () => actuar(async () => {
    if (!v.concepto) throw fallo('Seleccione el concepto.');
    if (limpio(v.analisis).length < 10) throw fallo('Escriba el análisis que sustenta el concepto.');
    const cupo = aNumero(v.cupo), plazo = Number(v.plazo) || 0;
    if (v.concepto !== 'desfavorable' && (!(cupo > 0) || !plazo)) throw fallo('Indique el cupo y el plazo que recomienda.');
    const des = v.concepto === 'desfavorable';
    await A.guardar(sol.id, { estado: 'pendiente_aprobacion', evaluacion: Object.assign(firma(), { concepto: v.concepto, cupoRecomendado: des ? 0 : cupo, plazoRecomendado: des ? 0 : plazo, analisis: limpio(v.analisis) }) },
      'Registró la evaluación financiera', CONCEPTOS[v.concepto] + (des ? '' : ' · recomienda ' + fmtDinero(cupo) + ' a ' + plazo + ' días'));
  }, 'Evaluación registrada. La ficha pasó a gerencia.');
  return html`<div class="tarjeta destacada"><div class="cab"><h2>Su turno: evaluación financiera</h2>
    <p>El cliente solicita ${fmtDinero(sol.credito.cupoSolicitado)} a ${sol.credito.plazoSolicitado} días. Revise los estados financieros y recomiende cupo y plazo.</p></div><div class="cuerpo">
    <div class="campos">
      <${Texto} v=${v} c="concepto" poner=${setV} etiqueta="Concepto" opciones=${Object.entries(CONCEPTOS)} />
      ${v.concepto === 'desfavorable' ? null : html`<${Texto} v=${v} c="cupo" poner=${setV} etiqueta="Cupo recomendado (pesos)" tipo="dinero" />
        <${Texto} v=${v} c="plazo" poner=${setV} etiqueta="Plazo recomendado" opciones=${PLAZOS.map((p) => [String(p), p + ' días'])} />`}
      <${Texto} v=${v} c="analisis" poner=${setV} etiqueta="Análisis" lineas=${4} ancho=${true} largo=${3000} ayuda="Liquidez, endeudamiento, comportamiento de pago, referencias y cualquier condición que recomiende." />
    </div>
    <div class="pie-form"><button class="btn" disabled=${ocupado} onClick=${enviar}>Enviar a gerencia</button>
      <${Devolver} sol=${sol} etapa="Evaluación financiera" firma=${firma} A=${A} actuar=${actuar} ocupado=${ocupado} /></div>
  </div></div>`;
}

function PanelGerencia({ sol, perfil, firma, A, actuar, ocupado }) {
  const ev = sol.evaluacion || {};
  const [v, setV] = useState({ cupo: fmtMiles(ev.cupoRecomendado || sol.credito.cupoSolicitado), plazo: String(ev.plazoRecomendado || sol.credito.plazoSolicitado || ''), condiciones: '', motivo: '' });
  const [confirmar, setConfirmar] = useState(null); // 'aprobada' | 'rechazada'
  if ((sol.revision && sol.revision.por === perfil.uid) || ev.por === perfil.uid) {
    return html`<${Alerta} tono="aviso"><b>Esta decisión debe tomarla otra persona.</b> Usted participó en la revisión o en la evaluación de este estudio, y la revisión, la evaluación y la aprobación deben estar en manos de tres personas distintas.<//>`;
  }
  const cupo = aNumero(v.cupo), plazo = Number(v.plazo) || 0;
  const pedir = (resultado) => {
    if (resultado === 'aprobada' && (!(cupo > 0) || !plazo)) { actuar(async () => { throw fallo('Indique el cupo y el plazo que aprueba.'); }); return; }
    if (resultado === 'rechazada' && !limpio(v.motivo)) { actuar(async () => { throw fallo('Escriba el motivo del rechazo.'); }); return; }
    setConfirmar(resultado);
  };
  const decidir = () => actuar(async () => {
    const ap = confirmar === 'aprobada';
    await A.guardar(sol.id, { estado: confirmar, decision: Object.assign(firma(), { resultado: confirmar, cupoAprobado: ap ? cupo : 0, plazoAprobado: ap ? plazo : 0, condiciones: ap ? limpio(v.condiciones) : '', motivo: ap ? '' : limpio(v.motivo) }) },
      ap ? 'Aprobó el crédito' : 'Rechazó el crédito', ap ? fmtDinero(cupo) + ' a ' + plazo + ' días' : limpio(v.motivo));
    setConfirmar(null);
  }, confirmar === 'aprobada' ? 'Crédito aprobado. El asesor ya puede informar al cliente.' : 'Crédito rechazado. El asesor ya puede informar al cliente.');
  return html`<div class="tarjeta destacada"><div class="cab"><h2>Su turno: decidir</h2>
    <p>Solicita ${fmtDinero(sol.credito.cupoSolicitado)} a ${sol.credito.plazoSolicitado} días. Evaluación financiera: ${CONCEPTOS[ev.concepto] || '—'}${ev.cupoRecomendado ? ', recomienda ' + fmtDinero(ev.cupoRecomendado) + ' a ' + ev.plazoRecomendado + ' días' : ''}.</p></div><div class="cuerpo">
    <div class="campos">
      <${Texto} v=${v} c="cupo" poner=${setV} etiqueta="Cupo que aprueba (pesos)" tipo="dinero" />
      <${Texto} v=${v} c="plazo" poner=${setV} etiqueta="Plazo que aprueba" opciones=${PLAZOS.map((p) => [String(p), p + ' días'])} />
      <${Texto} v=${v} c="condiciones" poner=${setV} etiqueta="Condiciones de la aprobación (opcional)" lineas=${2} ancho=${true} largo=${600} ayuda="El asesor se las comunicará al cliente." />
      <${Texto} v=${v} c="motivo" poner=${setV} etiqueta="Motivo, si rechaza" lineas=${2} ancho=${true} largo=${600} ayuda="Queda en el expediente; no se incluye en el mensaje al cliente." />
    </div>
    <div class="pie-form"><button class="btn" disabled=${ocupado} onClick=${() => pedir('aprobada')}><${Icono} n="check" />Aprobar</button>
      <button class="btn mal" disabled=${ocupado} onClick=${() => pedir('rechazada')}><${Icono} n="x" />Rechazar</button>
      <${Devolver} sol=${sol} etapa="Gerencia" firma=${firma} A=${A} actuar=${actuar} ocupado=${ocupado} /></div>
    ${confirmar ? html`<${Modal} titulo=${confirmar === 'aprobada' ? 'Confirmar aprobación' : 'Confirmar rechazo'} cerrar=${() => setConfirmar(null)}
      pie=${html`<button class=${'btn' + (confirmar === 'rechazada' ? ' mal' : '')} disabled=${ocupado} onClick=${decidir}>${confirmar === 'aprobada' ? 'Sí, aprobar' : 'Sí, rechazar'}</button><button class="btn sec" onClick=${() => setConfirmar(null)}>Volver</button>`}>
      <p>${confirmar === 'aprobada' ? html`Aprueba a <b>${sol.cliente.razonSocial}</b> un cupo de <b>${fmtDinero(cupo)}</b> con plazo de <b>${plazo} días</b>.` : html`No aprueba el crédito de <b>${sol.cliente.razonSocial}</b>.`}</p>
      <p class="tenue" style="margin-top:8px">La decisión queda firmada con su nombre y no se puede cambiar después.</p><//>` : null}
  </div></div>`;
}

function PanelAviso({ sol, config, firma, A, actuar, ocupado, avisar }) {
  const [v, setV] = useState({ mensaje: mensajeResultado(sol, config.empresa), medio: 'WhatsApp', nota: '' });
  const numero = numeroWhatsApp(sol.cliente.whatsapp);
  const copiar = async () => { try { await navigator.clipboard.writeText(v.mensaje); avisar('Mensaje copiado.'); } catch (e) { avisar('No se pudo copiar: seleccione el texto y cópielo a mano.', 'mal'); } };
  const registrar = () => actuar(async () => {
    await A.guardar(sol.id, { informado: Object.assign(firma(), { medio: v.medio, nota: limpio(v.nota) }), abierta: false }, 'Informó el resultado al cliente', v.medio);
  }, 'Aviso registrado. El estudio quedó cerrado.');
  return html`<div class="tarjeta destacada"><div class="cab"><h2>Su turno: informar al cliente</h2>
    <p>${sol.estado === 'aprobada' ? 'Gerencia aprobó ' + fmtDinero(sol.decision.cupoAprobado) + ' a ' + sol.decision.plazoAprobado + ' días.' : 'Gerencia no aprobó el crédito.'} Envíe el mensaje y luego registre que el cliente quedó informado.</p></div><div class="cuerpo">
    <div class="campos"><${Texto} v=${v} c="mensaje" poner=${setV} etiqueta="Mensaje para el cliente (puede ajustarlo)" lineas=${5} ancho=${true} largo=${1500} /></div>
    <div class="pie-form">
      ${numero ? html`<a class="btn" target="_blank" rel="noopener" href=${'https://wa.me/' + numero + '?text=' + encodeURIComponent(v.mensaje)}><${Icono} n="chat" />Abrir WhatsApp (${sol.cliente.whatsapp})</a>` : html`<span class="tenue chica">El cliente no tiene número de WhatsApp registrado.</span>`}
      <button class="btn sec" onClick=${copiar}><${Icono} n="copiar" />Copiar mensaje</button>
    </div>
    <h3 class="grupo" style="margin-top:20px">Cuando ya le haya informado</h3>
    <div class="campos">
      <${Texto} v=${v} c="medio" poner=${setV} etiqueta="¿Por qué medio le informó?" opciones=${MEDIOS_AVISO} />
      <${Texto} v=${v} c="nota" poner=${setV} etiqueta="Nota (opcional)" largo=${300} ayuda="Por ejemplo, con quién habló." />
    </div>
    <div class="pie-form"><button class="btn" disabled=${ocupado || !v.medio} onClick=${registrar}>Registrar que el cliente fue informado</button></div>
  </div></div>`;
}

function ModalLiberar({ sol, A, actuar, ocupado, cerrar, descargarZip }) {
  const [listo, setListo] = useState(false);
  const total = bytesDeSolicitud(sol), n = Object.values(sol.docs || {}).filter((d) => d && d.archivoId).length;
  const liberar = () => actuar(async () => {
    const docs = {};
    for (const c of Object.keys(sol.docs || {})) {
      const d = sol.docs[c];
      if (d && d.archivoId) { await A.borrarArchivo(d.archivoId, d.partes); docs[c] = Object.assign({}, d, { archivoId: null, partes: 0, eliminado: true, eliminadoEn: ahoraISO() }); } else docs[c] = d;
    }
    await A.guardar(sol.id, { docs }, 'Eliminó los archivos para liberar espacio', n + ' archivos, ' + fmtTamano(total));
    cerrar();
  }, 'Archivos eliminados. Los datos y el historial se conservan.');
  return html`<${Modal} titulo="Eliminar los archivos de este cliente" cerrar=${ocupado ? null : cerrar}
    pie=${html`<button class="btn mal" disabled=${ocupado || !listo} onClick=${liberar}>${ocupado ? 'Eliminando…' : 'Eliminar ' + n + ' archivos'}</button><button class="btn sec" onClick=${cerrar} disabled=${ocupado}>Cancelar</button>`}>
    <p>Se eliminarán ${n} archivos (${fmtTamano(total)}) para liberar espacio. Los datos del cliente, las decisiones y el historial se conservan. Para un nuevo estudio habrá que volver a cargarlos. Esto no se puede deshacer.</p>
    <p style="margin:10px 0"><button class="btn sec chico" disabled=${ocupado} onClick=${descargarZip}><${Icono} n="bajar" />Descargar el expediente (ZIP)</button></p>
    <div class="opciones"><label><input type="checkbox" checked=${listo} onChange=${(e) => setListo(e.target.checked)} />Ya descargué el expediente y lo guardé en un lugar seguro.</label></div>
  <//>`;
}

// ===================================================================================================
// 7. ADMINISTRACIÓN: usuarios, configuración y cuenta propia
// ===================================================================================================
const claveTemporal = () => { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({ length: 10 }, () => a[Math.floor(Math.random() * a.length)]).join(''); };

function CasillasRoles({ roles, poner }) {
  return html`<div class="campo ancho"><span class="rotulo">Roles</span>
    ${Object.keys(ROLES).map((r) => html`<label key=${r} class="chica" style="display:flex;gap:8px;align-items:flex-start;margin-top:4px;font-size:14.5px;cursor:pointer">
      <input type="checkbox" style="margin-top:4px" checked=${roles.includes(r)} onChange=${(e) => poner(e.target.checked ? roles.concat(r) : roles.filter((x) => x !== r))} />
      <span><b>${ROLES[r]}</b><span class="tenue"> — ${AYUDA_ROL[r]}</span></span></label>`)}
  </div>`;
}

function PantallaUsuarios({ A, perfil, avisar }) {
  const [lista, setLista] = useState(null);
  const [nuevo, setNuevo] = useState(null);   // formulario de alta
  const [edit, setEdit] = useState(null);     // usuario en edición
  const [creado, setCreado] = useState(null); // datos para entregar al usuario recién creado
  const [corr, setCorr] = useState(null);     // corrección de correo dentro de la edición
  const [enlace, setEnlace] = useState(null); // correo al que se envió el enlace de confirmación
  const [ocupado, correr] = useAccion(avisar);
  const cargar = useCallback(async () => { try { setLista(await A.usuarios()); } catch (e) { avisar(textoError(e), 'mal'); setLista([]); } }, []);
  useEffect(() => { cargar(); }, []);

  const crear = (e) => {
    e.preventDefault();
    correr(async () => {
      if (!limpio(nuevo.nombre)) throw fallo('Escriba el nombre.');
      if (!esCorreo(nuevo.correo)) throw fallo('Escriba un correo válido.');
      if (nuevo.clave.length < 8) throw fallo('La contraseña temporal debe tener al menos 8 caracteres.');
      if (!nuevo.roles.length) throw fallo('Asigne al menos un rol.');
      await A.crearUsuario(nuevo);
      setCreado({ nombre: limpio(nuevo.nombre), correo: limpio(nuevo.correo).toLowerCase(), clave: nuevo.clave });
      setNuevo(null); await cargar();
    }, 'Usuario creado.');
  };
  const guardar = () => correr(async () => {
    if (!limpio(edit.nombre)) throw fallo('Escriba el nombre.');
    if (edit.activo && !edit.roles.length) throw fallo('Asigne al menos un rol o desactive la cuenta.');
    if (edit.id === perfil.uid && (!edit.activo || !edit.roles.includes('administrador'))) throw fallo('No puede quitarse a usted mismo el rol de administrador ni desactivar su propia cuenta.');
    await A.guardarUsuario(edit.id, { nombre: limpio(edit.nombre), roles: edit.roles, activo: edit.activo });
    cerrarEdicion(); await cargar();
  }, 'Cambios guardados.');
  const reiniciar = (u) => correr(() => A.recuperarClave(u.correo), 'Se envió a ' + u.correo + ' un correo para crear una contraseña nueva.');
  const cerrarEdicion = () => { setEdit(null); setCorr(null); };
  const esYo = Boolean(edit) && edit.id === perfil.uid;
  const corregir = () => correr(async () => {
    if (!esCorreo(corr.correoNuevo)) throw fallo('Escriba un correo válido.');
    const nuevoCorreo = limpio(corr.correoNuevo).toLowerCase();
    if (nuevoCorreo === edit.correo) throw fallo('Ese es el correo que ya tiene.');
    if (esYo) {
      if (!corr.claveCorr) throw fallo('Escriba su contraseña actual.');
      await A.cambiarMiCorreo(corr.claveCorr, nuevoCorreo);
      setCreado(null); setEnlace(nuevoCorreo); cerrarEdicion(); return;
    }
    if (corr.claveCorr.length < 8) throw fallo('La contraseña temporal debe tener al menos 8 caracteres.');
    await A.corregirCorreo(edit, nuevoCorreo, corr.claveCorr);
    setEnlace(null); setCreado({ nombre: edit.nombre, correo: nuevoCorreo, clave: corr.claveCorr });
    cerrarEdicion(); await cargar();
  }, esYo ? null : 'Correo corregido.');

  const visibles = (lista || []).filter((u) => !u.reemplazada); // las cuentas reemplazadas por una corrección de correo no se muestran
  const activos = (lista || []).filter((u) => u.activo);
  const con = (r) => activos.filter((u) => (u.roles || []).includes(r));
  const personasPasos = new Set([].concat(con('revisor'), con('financiero'), con('gerencia')).map((u) => u.id));
  const faltaRol = ['asesor', 'revisor', 'financiero', 'gerencia'].filter((r) => !con(r).length);

  return html`<div>
    <div class="encabezado"><div><h1>Usuarios</h1><p class="sub">Cada persona entra con su correo y su contraseña. Solo puede hacer lo que permiten sus roles.</p></div>
      <div class="acciones"><button class="btn" onClick=${() => { setCreado(null); setEnlace(null); setNuevo({ nombre: '', correo: '', clave: claveTemporal(), roles: [] }); }}><${Icono} n="mas" />Nuevo usuario</button></div></div>

    ${lista && faltaRol.length ? html`<${Alerta} tono="aviso"><b>Faltan personas para completar el flujo:</b> nadie tiene el rol de ${faltaRol.map((r) => ROLES[r]).join(', ')}.<//>` : null}
    ${lista && !faltaRol.length && personasPasos.size < 3 ? html`<${Alerta} tono="aviso"><b>Se necesitan tres personas distintas</b> entre revisión de documentos, evaluación financiera y gerencia. Hoy solo hay ${personasPasos.size}: una misma persona no puede hacer dos de esos pasos en la misma solicitud.<//>` : null}
    ${enlace ? html`<${Alerta} tono="info"><b>Se envió un enlace de confirmación a ${enlace}.</b> Ábralo desde ese correo (revise también el no deseado). Cuando lo abra, entre a la plataforma con el correo nuevo; hasta entonces sigue valiendo el actual.<//>` : null}
    ${creado ? html`<${Alerta} tono="bien"><b>Entréguele estos datos a ${creado.nombre}:</b> correo <b>${creado.correo}</b>, contraseña temporal <b class="mono">${creado.clave}</b>. Pídale que la cambie en “Mi cuenta” al entrar. Esta contraseña no se vuelve a mostrar.<//>` : null}

    ${nuevo ? html`<form class="tarjeta destacada" onSubmit=${crear}><div class="cab"><h2>Nuevo usuario</h2></div><div class="cuerpo">
      <div class="campos">
        <${Texto} v=${nuevo} c="nombre" poner=${setNuevo} etiqueta="Nombre completo" />
        <${Texto} v=${nuevo} c="correo" poner=${setNuevo} etiqueta="Correo" tipo="email" />
        <${Texto} v=${nuevo} c="clave" poner=${setNuevo} etiqueta="Contraseña temporal" ayuda="Se la entrega usted; la persona la cambia al entrar." />
        <${CasillasRoles} roles=${nuevo.roles} poner=${(roles) => setNuevo(Object.assign({}, nuevo, { roles }))} />
      </div>
      <div class="pie-form"><button class="btn" disabled=${ocupado}>Crear usuario</button><button type="button" class="btn sec" onClick=${() => setNuevo(null)}>Cancelar</button></div>
    </div></form>` : null}

    <div class="tarjeta">${lista === null ? html`<p class="vacio">Cargando…</p>` : html`<div class="tabla-caja"><table class="tabla">
      <thead><tr><th>Persona</th><th>Roles</th><th>Estado</th><th></th></tr></thead>
      <tbody>${visibles.map((u) => html`<tr key=${u.id}>
        <td><b>${u.nombre}</b>${u.id === perfil.uid ? html` <span class="tenue chica">(usted)</span>` : null}<div class="tenue chica">${u.correo}</div></td>
        <td>${(u.roles || []).map((r) => ROLES[r] || r).join(' · ') || '—'}</td>
        <td><${Etiqueta} tono=${u.activo ? 'bien' : 'neutro'} icono=${u.activo ? 'check' : 'x'}>${u.activo ? 'Activa' : 'Desactivada'}<//></td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sec chico" onClick=${() => { setCorr(null); setEdit(Object.assign({}, u, { roles: (u.roles || []).slice() })); }}><${Icono} n="lapiz" />Editar</button></td>
      </tr>`)}</tbody></table></div>`}</div>

    ${edit ? html`<${Modal} titulo=${'Editar: ' + edit.nombre} cerrar=${cerrarEdicion}
      pie=${html`<button class="btn" disabled=${ocupado} onClick=${guardar}>Guardar</button><button class="btn sec" onClick=${cerrarEdicion}>Cancelar</button>
        <button class="btn liso empuja" disabled=${ocupado} onClick=${() => reiniciar(edit)}>Enviar correo para cambiar la contraseña</button>`}>
      <div class="campos">
        <${Texto} v=${edit} c="nombre" poner=${setEdit} etiqueta="Nombre completo" ancho=${true} />
        <div class="campo ancho"><span class="rotulo">Correo</span>
          <div class="fila"><span>${edit.correo}</span>${corr ? null : html`<button type="button" class="btn sec chico" onClick=${() => setCorr({ correoNuevo: '', claveCorr: esYo ? '' : claveTemporal() })}><${Icono} n="lapiz" />Corregir correo</button>`}</div>
          ${corr ? html`<div class="caja-corr"><div class="campos">
            <${Texto} v=${corr} c="correoNuevo" poner=${setCorr} etiqueta=${esYo ? 'Correo nuevo' : 'Correo correcto'} tipo="email" />
            ${esYo ? html`<${Texto} v=${corr} c="claveCorr" poner=${setCorr} etiqueta="Su contraseña actual" tipo="clave" />`
              : html`<${Texto} v=${corr} c="claveCorr" poner=${setCorr} etiqueta="Contraseña temporal nueva" />`}
          </div>
          <p class="ayuda" style="margin-top:8px">${esYo ? 'Le llegará un enlace al correo nuevo. Al abrirlo, el cambio queda hecho y deberá entrar con el correo nuevo; hasta entonces sigue valiendo el actual.'
            : 'La cuenta de esta persona se crea de nuevo con el correo correcto, con el mismo nombre y los mismos roles. La cuenta con el correo equivocado queda desactivada y deja de aparecer en la lista.'}</p>
          <div class="pie-form" style="margin-top:10px"><button type="button" class="btn chico" disabled=${ocupado} onClick=${corregir}>${esYo ? 'Enviar enlace de confirmación' : 'Corregir correo'}</button>
            <button type="button" class="btn sec chico" onClick=${() => setCorr(null)}>Cancelar corrección</button></div></div>` : null}
        </div>
        <${CasillasRoles} roles=${edit.roles} poner=${(roles) => setEdit(Object.assign({}, edit, { roles }))} />
        <div class="campo ancho"><span class="rotulo">Acceso</span><div class="opciones"><label><input type="checkbox" checked=${edit.activo} onChange=${(e) => setEdit(Object.assign({}, edit, { activo: e.target.checked }))} />Cuenta activa (puede entrar)</label></div>
          <span class="ayuda">Cuando alguien deja la empresa, desactive su cuenta: su nombre se conserva en el historial.</span></div>
      </div><//>` : null}
  </div>`;
}

function PantallaConfiguracion({ A, config, ponerConfig, avisar, ir }) {
  const [v, setV] = useState({ empresa: config.empresa });
  const [tipos, setTipos] = useState(() => (config.tiposDocumento || []).map((t) => Object.assign({}, t, { vigencia: t.vigencia == null ? '' : String(t.vigencia) })));
  const [uso, setUso] = useState(null);
  const [ocupado, correr] = useAccion(avisar);
  const poner = (i, cambios) => setTipos((ts) => ts.map((t, j) => (j === i ? Object.assign({}, t, cambios) : t)));
  const agregar = () => setTipos((ts) => ts.concat({ codigo: 'doc_' + idCorto(), nombre: '', ayuda: '', obligatorio: false, vigencia: '', activo: true, nuevo: true }));

  const guardar = () => correr(async () => {
    if (!limpio(v.empresa)) throw fallo('Escriba el nombre de la empresa.');
    if (tipos.some((t) => !limpio(t.nombre))) throw fallo('Todos los documentos deben tener nombre.');
    const tiposDocumento = tipos.map((t) => ({ codigo: t.codigo, nombre: limpio(t.nombre), ayuda: limpio(t.ayuda), obligatorio: Boolean(t.obligatorio), vigencia: aNumero(t.vigencia) || null, activo: t.activo !== false }));
    const nueva = { empresa: limpio(v.empresa), tiposDocumento };
    await A.guardarConfig(nueva); ponerConfig(nueva);
  }, 'Configuración guardada.');
  const calcular = () => correr(async () => {
    const todas = await A.clientes();
    const filas = todas.map((s) => ({ s, bytes: bytesDeSolicitud(s) })).filter((x) => x.bytes > 0).sort((a, b) => b.bytes - a.bytes);
    setUso({ total: filas.reduce((n, x) => n + x.bytes, 0), solicitudes: todas.length, filas });
  });
  const pct = uso ? Math.min(100, (uso.total / CUPO_BASE_BYTES) * 100) : 0;
  const cerradasPesadas = uso ? uso.filas.filter((x) => ESTADOS_FINALES.includes(x.s.estado)).slice(0, 10) : [];

  return html`<div>
    <div class="encabezado"><div><h1>Configuración</h1><p class="sub">Nombre de la empresa, lista de documentos del expediente y espacio usado.</p></div></div>

    <div class="tarjeta"><div class="cab"><h2>Empresa y documentos del expediente</h2>
      <p>La vigencia son los días que sirve un documento contados desde su fecha de expedición. Déjela en blanco si el documento no vence.</p></div>
      <div class="cuerpo"><div class="campos"><${Texto} v=${v} c="empresa" poner=${setV} etiqueta="Nombre de la empresa" ayuda="Aparece en el encabezado y en el mensaje al cliente." /></div></div>
      <div class="tabla-caja"><table class="tabla"><thead><tr><th>Documento</th><th>Obligatorio</th><th>Vigencia (días)</th><th>En uso</th></tr></thead>
      <tbody>${tipos.map((t, i) => html`<tr key=${t.codigo}>
        <td style="min-width:280px"><input class="entrada" aria-label="Nombre del documento" maxlength="90" value=${t.nombre} onInput=${(e) => poner(i, { nombre: e.target.value })} /></td>
        <td><input type="checkbox" aria-label=${'Obligatorio: ' + t.nombre} checked=${Boolean(t.obligatorio)} onChange=${(e) => poner(i, { obligatorio: e.target.checked })} /></td>
        <td style="width:130px"><input class="entrada" inputmode="numeric" aria-label=${'Vigencia en días: ' + t.nombre} maxlength="4" placeholder="No vence" value=${t.vigencia} onInput=${(e) => poner(i, { vigencia: soloDigitos(e.target.value) })} /></td>
        <td><input type="checkbox" aria-label=${'En uso: ' + t.nombre} checked=${t.activo !== false} onChange=${(e) => poner(i, { activo: e.target.checked })} /></td>
      </tr>`)}</tbody></table></div>
      <div class="cuerpo"><div class="pie-form" style="margin-top:0"><button class="btn" disabled=${ocupado} onClick=${guardar}>Guardar configuración</button>
        <button class="btn sec" onClick=${agregar}><${Icono} n="mas" />Agregar documento</button>
        <span class="tenue chica">Un documento que ya no se pida se quita de “En uso”; los ya cargados se conservan.</span></div></div>
    </div>

    <div class="tarjeta"><div class="cab"><h2>Espacio usado</h2>
      <p>El plan gratuito de la base de datos guarda hasta 1 GB. Cuando se acerque al tope, descargue los documentos de los clientes inactivos y elimine sus archivos.</p></div><div class="cuerpo">
      ${uso ? html`<p style="margin-bottom:8px"><b>${fmtTamano(uso.total)}</b> en archivos de ${uso.filas.length} ${uso.filas.length === 1 ? 'cliente' : 'clientes'} (${pct.toFixed(1).replace('.', ',')} % de 1 GB). El uso real es un poco mayor, porque también cuentan los datos.</p>
        <div class=${'barra-uso' + (pct >= 90 ? ' lleno' : pct >= 70 ? ' alto' : '')}><i style=${'width:' + Math.max(1, pct) + '%'}></i></div>
        ${cerradasPesadas.length ? html`<h3 class="grupo" style="margin-top:18px">Clientes con crédito decidido que más ocupan</h3>
          <table class="tabla"><tbody>${cerradasPesadas.map(({ s, bytes }) => html`<tr key=${s.id} class="clic" onClick=${() => ir({ nombre: 'detalle', id: s.id })}>
            <td><b>${s.cliente.razonSocial}</b></td><td class="mono">NIT ${fmtNit(s.nit, s.cliente.dv)}</td><td><${EtiquetaEstado} estado=${s.estado} /></td><td class="num">${fmtTamano(bytes)}</td></tr>`)}</tbody></table>
          <p class="tenue chica" style="margin-top:8px">Abra la ficha de un cliente inactivo, descargue el ZIP y use “Eliminar archivos”.</p>` : null}` : null}
      <div class="pie-form" style=${uso ? '' : 'margin-top:0'}><button class="btn sec" disabled=${ocupado} onClick=${calcular}><${Icono} n="girar" />${uso ? 'Volver a calcular' : 'Calcular el espacio usado'}</button></div>
    </div></div>
  </div>`;
}

function PantallaCuenta({ A, perfil, avisar }) {
  const vacio = { actual: '', nueva: '', nueva2: '' };
  const [v, setV] = useState(vacio);
  const [ocupado, correr] = useAccion(avisar);
  const cambiar = (e) => {
    e.preventDefault();
    correr(async () => {
      if (v.nueva.length < 8) throw fallo('La contraseña nueva debe tener al menos 8 caracteres.');
      if (v.nueva !== v.nueva2) throw fallo('Las dos contraseñas nuevas no coinciden.');
      if (v.nueva === v.actual) throw fallo('La contraseña nueva debe ser distinta de la actual.');
      await A.cambiarClave(v.actual, v.nueva); setV(vacio);
    }, 'Contraseña cambiada.');
  };
  return html`<div>
    <div class="encabezado"><div><h1>Mi cuenta</h1></div></div>
    <div class="tarjeta"><div class="cuerpo"><dl class="datos">
      <div><dt>Nombre</dt><dd>${perfil.nombre}</dd></div><div><dt>Correo</dt><dd>${perfil.correo}<div class="tenue chica">Si quedó mal escrito, el administrador lo corrige en Usuarios › Editar.</div></dd></div>
      <div><dt>Roles</dt><dd>${(perfil.roles || []).map((r) => ROLES[r] || r).join(' · ')}</dd></div></dl></div></div>
    <form class="tarjeta" onSubmit=${cambiar}><div class="cab"><h2>Cambiar la contraseña</h2></div><div class="cuerpo">
      <div class="campos">
        <${Texto} v=${v} c="actual" poner=${setV} etiqueta="Contraseña actual" tipo="clave" />
        <${Texto} v=${v} c="nueva" poner=${setV} etiqueta="Contraseña nueva" tipo="clave" ayuda="Mínimo 8 caracteres." />
        <${Texto} v=${v} c="nueva2" poner=${setV} etiqueta="Repita la contraseña nueva" tipo="clave" />
      </div>
      <div class="pie-form"><button class="btn" disabled=${ocupado}>Cambiar contraseña</button></div>
    </div></form>
  </div>`;
}

// ===================================================================================================
// 9. ARRANQUE
// ===================================================================================================
(function arrancar() {
  const raiz = document.getElementById('raiz');
  const cfg = window.FIREBASE_CONFIG;
  const configurada = Boolean(cfg && typeof cfg === 'object' && cfg.apiKey && cfg.projectId && !/PEGUE|AQUI|XXXX/i.test(String(cfg.apiKey) + String(cfg.projectId)));
  raiz.textContent = ''; // quita el texto "Cargando…" inicial
  const iniciar = (F, c) => { render(null, raiz); raiz.textContent = ''; render(html`<${App} A=${crearAlmacen(F, c)} />`, raiz); };
  const recordarDemo = () => { try { return window.sessionStorage.getItem('credito-demo') === '1'; } catch (e) { return false; } };
  const demo = () => { try { window.sessionStorage.setItem('credito-demo', '1'); } catch (e) { /* sin almacenamiento: sigue igual */ } iniciar(crearSimulador(), {}); };
  if (configurada) iniciar(window.FB, cfg);
  else if (recordarDemo() || window.location.hash === '#demo') demo();
  else render(html`<${PantallaSinConfig} alProbar=${demo} />`, raiz);
})();

})();
</script>
